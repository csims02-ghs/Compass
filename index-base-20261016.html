    ["renderChart($('overviewChart'),state.sessions);const a=avgAccuracy(state.sessions);$('overviewProgressLabel').textContent=a==null?'No accuracy data':`Average independent accuracy ${a}%`}\n  function renderChart(el,sessions){","renderGoalAchievement()}\n  function renderGoalAchievement(){const el=$('overviewChart'),label=$('overviewProgressLabel');if(!el||!label)return;\n    const sid=state.currentStudent&&state.currentStudent.id,goals=(Array.isArray(state.goals)?state.goals:[]).filter(g=>!sid||!g.student_id||g.student_id===sid),gid=new Set(goals.map(g=>g.id)),links=(Array.isArray(state.goalLinks)?state.goalLinks:[]).filter(l=>gid.has(l.goal_id)),progs=Array.isArray(state.studentPrograms)?state.studentPrograms:[],sessions=Array.isArray(state.sessions)?state.sessions:[],colors=['#2366d5','#0f9d58','#e8710a','#a142f4','#d93025','#12b5cb'],byAsg=new Map();\n    links.forEach(l=>{const sp=progs.find(x=>x.id===l.student_compass_program_id);if(!sp)return;const cur=byAsg.get(sp.id)||{sp,goals:[]},g=goals.find(x=>x.id===l.goal_id);if(g&&!cur.goals.includes(g))cur.goals.push(g);byAsg.set(sp.id,cur)});\n    if(!byAsg.size){label.textContent='No programs linked to IEP goals';el.innerHTML='<div class=\"chart-empty\">No programs are linked to this student’s IEP goals yet. Use Connect IEP Goals to link a program.</div>';return}\n    const series=[...byAsg.values()].map((x,i)=>{const p=programById(x.sp.program_id),pts=sessions.filter(s=>s.student_compass_program_id===x.sp.id).map(s=>({s,v:accuracy(s),t:new Date(s.ended_at||s.created_at||s.session_date).getTime()})).filter(o=>o.v!=null&&Number.isFinite(o.t)).sort((a,b)=>a.t-b.t);return{name:(p&&p.program_name)||'Program',goals:x.goals,pts,color:colors[i%colors.length]}}),all=series.flatMap(s=>s.pts),avg=all.length?Math.round(all.reduce((t,o)=>t+o.v,0)/all.length):null;\n    label.textContent=avg==null?'No sessions yet for goal-linked programs':`Average independent accuracy ${avg}%`;\n    const legend='<div class=\"goal-chart-legend\" style=\"display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:10px;font-size:13px;color:#4a6280\">'+series.map(s=>`<span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:50%;background:${s.color};flex:none\"></span><b style=\"color:#17365d\">${esc(s.name)}</b>${s.goals.length?' · '+esc(s.goals.map(g=>[g.goal_area,g.title].filter(Boolean).join(': ')).join(', ')):''}<span style=\"color:#7a8ea6\">(${s.pts.length} session${s.pts.length===1?'':'s'})</span></span>`).join('')+'</div>';\n    if(!all.length){el.innerHTML='<div style=\"width:100%;text-align:center\"><div class=\"chart-empty\">No sessions recorded yet for programs linked to IEP goals.</div>'+legend+'</div>';return}\n    const w=900,h=300,pad=42,min=Math.min(...all.map(o=>o.t)),max=Math.max(...all.map(o=>o.t)),x=t=>max===min?w/2:pad+(w-2*pad)*((t-min)/(max-min)),y=v=>h-pad-(h-2*pad)*(Math.max(0,Math.min(100,v))/100),grid=[0,25,50,75,100].map(v=>`<line x1=\"${pad}\" y1=\"${y(v)}\" x2=\"${w-pad}\" y2=\"${y(v)}\" stroke=\"#dbe5ef\"/><text x=\"4\" y=\"${y(v)+5}\" fill=\"#637b98\" font-size=\"13\">${v}%</text>`).join(''),targets=[...new Set(series.flatMap(s=>s.goals.map(g=>Number(g.target_percent))).filter(v=>Number.isFinite(v)&&v>0&&v<=100))],tl=targets.map(v=>`<line x1=\"${pad}\" y1=\"${y(v)}\" x2=\"${w-pad}\" y2=\"${y(v)}\" stroke=\"#15803d\" stroke-width=\"2\" stroke-dasharray=\"6 5\" vector-effect=\"non-scaling-stroke\"/><text x=\"${w-pad}\" y=\"${y(v)-6}\" text-anchor=\"end\" fill=\"#15803d\" font-size=\"12\" font-weight=\"700\">Goal ${v}%</text>`).join(''),lines=series.map(s=>{const poly=s.pts.map(o=>`${x(o.t)},${y(o.v)}`).join(' '),dots=s.pts.map(o=>`<circle cx=\"${x(o.t)}\" cy=\"${y(o.v)}\" r=\"4\" fill=\"${s.color}\"><title>${esc(s.name)} · ${fmtDate(o.s.session_date||o.s.created_at)}: ${o.v}%</title></circle>`).join('');return(s.pts.length>1?`<polyline points=\"${poly}\" fill=\"none\" stroke=\"${s.color}\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"/>`:'')+dots}).join('');\n    el.innerHTML=`<div style=\"width:100%\"><svg class=\"chart-svg\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\">${grid}${tl}${lines}</svg>${legend}</div>`}\n  function renderChart(el,sessions){","IEP goal chart from goal-linked hub programs"]
  ];
  const status=document.getElementById('status');

  const binary=atob(b64),zipped=new Uint8Array(binary.length);

  if(typeof DecompressionStream!=='function')throw new Error('This browser cannot open the verified COMPASS release. Please update the browser.');

  async function loadStudentProfile(){

    const priorPrograms=(Array.isArray(state.studentPrograms)?state.studentPrograms:[]).filter(x=>x.student_id===sid);

    const priorServices=(Array.isArray(state.services)?state.services:[]).filter(x=>x.student_id===sid);
    const priorLogs=(Array.isArray(state.serviceLogs)?state.serviceLogs:[]).filter(x=>x.student_id===sid);
    const grab=async fn=>{try{return await fn()}catch(error){return{data:null,error}}};
    const take=(r,prior,label)=>{if(r&&r.error){console.warn('COMPASS profile reload failed: '+label,r.error);return prior}return Array.isArray(r?.data)?r.data:prior};
    const [programRes,goalRes,noteRes,docRes,assessmentRes,serviceRes,logRes]=await Promise.all([
      grab(()=>sb.from('student_compass_programs').select('*').eq('student_id',sid).order('display_order')),
      grab(()=>sb.from('student_iep_goals').select('*').eq('student_id',sid).order('created_at',{ascending:false})),

      grab(()=>sb.from('student_assessments').select('*').eq('student_id',sid).order('updated_at',{ascending:false})),

    const programs=take(programRes,priorPrograms,'programs'),goals=take(goalRes,priorGoals,'IEP goals'),notes=take(noteRes,priorNotes,'notes'),docs=take(docRes,priorDocs,'documents'),assessments=take(assessmentRes,priorAssessments,'assessments'),services=take(serviceRes,priorServices,'services'),logs=take(logRes,priorLogs,'service logs');
    Object.assign(state,{studentPrograms:programs,goals,notes,documents:docs,assessments,services,serviceLogs:logs});
    const ids=programs.map(x=>x.id),programIdSet=new Set(ids),priorSessions=(Array.isArray(state.sessions)?state.sessions:[]).filter(x=>programIdSet.has(x.student_compass_program_id));

    const linkRes=gids.length?await grab(()=>sb.from('student_iep_goal_compass_programs').select('*').in('goal_id',gids)):{data:[],error:null};

  `;
  html=html.slice(0,profileLoadStart)+profileLoadReplacement+html.slice(profileLoadEnd);

  const oldGoalSave=`let id=goal?.id;if(id){const {error}=await sb.from('student_iep_goals').update(payload).eq('id',id);if(error){toast(error.message,'error');return}const {error:de}=await sb.from('student_iep_goal_compass_programs').delete().eq('goal_id',id);if(de){toast(de.message,'error');return}}else{const {data,error}=await sb.from('student_iep_goals').insert(payload).select('id').single();if(error){toast(error.message,'error');return}id=data.id}const sel=qsa('input[name="goalProgram"]:checked',$('goalForm')).map(x=>x.value);if(sel.length){const {error}=await sb.from('student_iep_goal_compass_programs').insert(sel.map(sp=>({goal_id:id,student_compass_program_id:sp})));if(error){toast(error.message,'error');return}}closeModal();toast('IEP goal saved.');await loadStudentProfile();await loadGlobalData()`;
  const newGoalSave=`let id=goal?.id,savedGoal=null;if(id){const {data,error}=await sb.from('student_iep_goals').update(payload).eq('id',id).select('*').single();if(error){toast(error.message,'error');return}savedGoal=data;const {error:de}=await sb.from('student_iep_goal_compass_programs').delete().eq('goal_id',id);if(de){toast(de.message,'error');return}}else{const {data,error}=await sb.from('student_iep_goals').insert(payload).select('*').single();if(error){toast(error.message,'error');return}savedGoal=data;id=data.id}const sel=qsa('input[name="goalProgram"]:checked',$('goalForm')).map(x=>x.value),linkRows=sel.map(sp=>({goal_id:id,student_compass_program_id:sp}));if(linkRows.length){const {error}=await sb.from('student_iep_goal_compass_programs').insert(linkRows);if(error){toast(error.message,'error');return}}closeModal();if(savedGoal&&state.currentStudent?.id===payload.student_id){state.goals=[savedGoal,...(Array.isArray(state.goals)?state.goals:[]).filter(g=>g.id!==id&&g.student_id===payload.student_id)].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));state.goalLinks=[...(Array.isArray(state.goalLinks)?state.goalLinks:[]).filter(l=>l.goal_id!==id),...linkRows];renderStudentProfile()}toast('IEP goal saved.');await loadStudentProfile();if(savedGoal&&state.currentStudent?.id===payload.student_id&&!state.goals.some(g=>g.id===id)){state.goals=[savedGoal,...state.goals.filter(g=>g.id!==id)];state.goalLinks=[...state.goalLinks.filter(l=>l.goal_id!==id),...linkRows];renderStudentProfile()}await loadGlobalData()`;
  if(html.split(oldGoalSave).length!==2)throw new Error('COMPASS IEP goal persistence check failed: goal save handler not found exactly once');
  html=html.replace(oldGoalSave,newGoalSave);

  // COMPASS checkbox assign programs v1
  const assignProgramStart=html.indexOf("function openAssignProgram(pre=''){");
  const assignProgramEnd=html.indexOf('function activeStudentProgramsOrdered()',assignProgramStart);
  if(assignProgramStart<0||assignProgramEnd<0)throw new Error('COMPASS checkbox assignment check failed: handler not found');
  const assignProgramReplacement="function openAssignProgram(pre=''){\n  if(!state.currentStudent){toast('Open a student profile first.','error');return}\n  const assigned=new Set(state.studentPrograms.filter(sp=>['active','hold','mastered'].includes(sp.status)).map(sp=>sp.program_id));\n  const available=state.programCatalog.filter(p=>p.active!==false&&!assigned.has(p.id)).sort((a,b)=>String(a.program_name||'').localeCompare(String(b.program_name||'')));\n  const rows=available.map(p=>`<label class=\"assign-program-choice\" data-program-search=\"${esc(((p.program_name||'Program')+' '+programDomain(p)).toLowerCase())}\"><input type=\"checkbox\" name=\"assignProgramChoice\" value=\"${p.id}\"${p.id===pre?' checked':''}><span><strong>${esc(p.program_name||'Program')}</strong><small>${esc(programDomain(p))}</small></span></label>`).join('');\n  openModal('Assign COMPASS Programs',`<form id=\"assignProgramForm\" class=\"form-stack assign-program-form\"><div class=\"assign-program-picker-head\"><div><strong>Select Programs</strong><small>Check one or more programs to assign to this student.</small></div><strong id=\"assignProgramSelectedCount\" class=\"assign-program-selected-count\">0 selected</strong></div>${available.length?'<input id=\"assignProgramSearch\" type=\"search\" placeholder=\"Search available programs\u2026\"><div class=\"assign-program-picker-actions\"><button id=\"assignProgramCheckAll\" class=\"btn small\" type=\"button\">Check All</button><button id=\"assignProgramClear\" class=\"btn small\" type=\"button\">Clear</button></div>':''}<div id=\"assignProgramPicker\" class=\"assign-program-picker\">${rows||'<div class=\"empty-state compact\">All active COMPASS programs are already assigned to this student.</div>'}</div><div class=\"two-col\"><label>Goal %<input id=\"assignProgramGoal\" type=\"number\" min=\"0\" max=\"100\" value=\"80\"></label><label>Trials Per Session<input id=\"assignProgramTrials\" type=\"number\" min=\"1\" max=\"100\"></label></div><button class=\"btn primary assign-program-submit\" type=\"submit\"${available.length?'':' disabled'}>Assign Selected Programs</button></form>`,()=>{\n    document.querySelector('.modal')?.classList.add('assign-program-modal');\n    const checks=()=>qsa('#assignProgramPicker input[name=\"assignProgramChoice\"]');\n    const refreshCount=()=>{const n=checks().filter(c=>c.checked).length,el=$('assignProgramSelectedCount');if(el)el.textContent=n+' selected'};\n    $('assignProgramSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();qsa('#assignProgramPicker .assign-program-choice').forEach(row=>row.classList.toggle('assign-program-filtered',!!q&&!String(row.dataset.programSearch||'').includes(q)))});\n    $('assignProgramCheckAll')?.addEventListener('click',()=>{checks().filter(c=>!c.closest('.assign-program-filtered')).forEach(c=>c.checked=true);refreshCount()});\n    $('assignProgramClear')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=false);refreshCount()});\n    $('assignProgramPicker')?.addEventListener('change',refreshCount);\n    refreshCount();\n    $('assignProgramForm').addEventListener('submit',async e=>{\n      e.preventDefault();\n      const pids=checks().filter(c=>c.checked).map(c=>c.value);\n      if(!pids.length){toast('Select at least one COMPASS program.','error');return}\n      const visible=state.studentPrograms.filter(x=>x.status!=='archived');\n      const max=Math.max(0,...visible.map(x=>Number(x.display_order||0)));\n      const goal=Number($('assignProgramGoal').value||80),trials=$('assignProgramTrials').value?Number($('assignProgramTrials').value):null;\n      const insertRows=pids.map((pid,i)=>({student_id:state.currentStudent.id,program_id:pid,assigned_by:state.user.id,status:'active',goal_percentage:goal,display_order:max+i+1,trials_per_session:trials}));\n      const {error}=await sb.from('student_compass_programs').insert(insertRows);\n      if(error){toast(error.message,'error');return}\n      c
