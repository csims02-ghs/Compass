</style></head><body><div class="app"><aside><div class="brand"><h1 id="studentName">Student Programs</h1><small>COMPASS Student Program Hub</small></div><div class="meta"><strong id="studentMeta">Loading student…</strong><small id="programCount">Loading assigned programs…</small><div id="behaviorPills" class="pills"></div></div><input id="search" class="search" type="search" placeholder="Search programs…"><div id="programList" class="list"></div></aside><main><div class="top"><div class="title"><h2 id="runnerTitle">Program Hub</h2><p id="runnerSubtitle">Choose a program from the left.</p></div><div class="actions"><button id="prevBtn" class="btn" disabled>← Previous</button><button id="nextBtn" class="btn primary" disabled>Next Program →</button><button id="closeBtn" class="btn">Close Hub</button></div></div><div class="card"><div class="framewrap"><div id="empty" class="empty"><div><strong>Select a program</strong><br>Choose one of this student's assigned programs.</div></div><iframe id="runnerFrame" class="runner" title="COMPASS Program Runner" scrolling="auto" hidden></iframe></div><div class="bottom"><button id="bottomPrevBtn" class="btn" disabled>← Previous Program</button><button id="bottomNextBtn" class="btn primary" disabled>Next Program →</button></div></div><div id="status" class="status">Connecting to COMPASS…</div></main></div>

<script>
(async()=>{

function patchBehavior(html){const P=(Array.isArray(S.student?.selected_behaviors)?S.student.selected_behaviors:[]).slice(0,5),J=JSON.stringify(P).replace(/</g,'\\u003c'),script=`<script id="compass-student-behavior-context-hub-v4">(function(){const P=${J},SIG=P.join('|');window.__COMPASS_BEHAVIOR_CONTEXT__='student-primary';window.__COMPASS_BEHAVIOR_COUNTS__=window.__COMPASS_BEHAVIOR_COUNTS__||{};function h(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function k(s,i){return String(s||'').replace(/[^A-Za-z0-9_]/g,'')||('Behavior'+(i+1))}function visible(){const b=document.getElementById('behaviorBar');if(!b)return;b.hidden=false;b.removeAttribute('aria-hidden');b.style.removeProperty('display');if(getComputedStyle(b).display==='none')b.style.setProperty('display','grid','important')}function draw(){const c=window.__COMPASS_BEHAVIOR_COUNTS__||{};P.forEach((n,i)=>{const e=document.getElementById('compass-student-behavior-'+k(n,i));if(e){const v=String(Math.max(0,Number(c[n]||0)));if(e.textContent!==v)e.textContent=v}})}function d(n,v){const c=window.__COMPASS_BEHAVIOR_COUNTS__||(window.__COMPASS_BEHAVIOR_COUNTS__={});c[n]=Math.max(0,Number(c[n]||0)+v);draw()}function reset(){window.__COMPASS_BEHAVIOR_COUNTS__={};draw()}function healthy(){const h=document.getElementById('behaviorItems');return !!h&&h.getAttribute('data-compass-student-mounted')===SIG&&h.querySelectorAll('[data-compass-student-behavior="1"]').length===P.length}function mount(){visible();const host=document.getElementById('behaviorItems');if(!host)return false;host.replaceChildren();P.forEach((n,i)=>{const w=document.createElement('div'),id=k(n,i);w.className='behavior';w.setAttribute('data-compass-student-behavior','1');w.innerHTML='<button class="minus" type="button">−</button><span>'+h(n)+'</span><b class="count" id="compass-student-behavior-'+id+'">0</b><button class="plus" type="button">+</button>';w.querySelector('.minus').onclick=()=>d(n,-1);w.querySelector
