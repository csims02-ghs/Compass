}
async function saveV25Run(sp,entry){
 if(!usesV25Counting(sp)||entry?.kind!=='run_completed'||!entry.data?.id||entry.studentId!==sp.student_id)return;
 const id=String(entry.data.id),key=sp.id+':'+id;
 if(v25SavesInFlight.has(key)||v25SavesConfirmed.has(key))return;
 v25SavesInFlight.add(key);
 try{
  const body=v25Payload(sp,entry.data);
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token||session.user.id!==S.session.user.id)throw Error('Sign in to sync');
  const response=await fetch(runtimeEndpoint({id:sp.id,view_token:sp.view_token,program:null}),{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},
   body:JSON.stringify(body),cache:'no-store'
  });
  const data=await response.json().catch(()=>null);
  if(!response.ok||!data?.ok||!data.session_id)throw Error(data?.error||'Cloud save not confirmed');
  v25SavesConfirmed.add(key);
  if(usesV25Counting(S.programs[S.index])&&S.programs[S.index]?.id===sp.id){
   $('runnerFrame').contentWindow?.postMessage({type:'COMPASS_DEMO_V18_SYNC_CONFIRMED',studentId:sp.student_id,outboxId:entry.id,runId:id},location.origin);
  }
  status('COMPASS confirmed completed-run save ('+data.saved_trial_events+' step records).','ok');
 }catch(error){
  console.warn('V25 cloud save pending',error);
  status('Run preserved on device; COMPASS cloud sync pending. Reopen the program when online to retry.','error');
 }finally{v25SavesInFlight.delete(key)}
}
// COMPASS AUTH BRIDGE V1: provide a fresh access token only to the currently
// loaded, same-origin student program iframe after matching its assignment.
// The backend independently verifies staff identity and student permissions.
addEventListener('message',async event=>{
 if(event.data?.type!=='compass-auth-request')return;
 const frame=$('runnerFrame'),sp=S.programs[S.index],req=event.data||{};
 if(event.source!==frame?.contentWindow||event.origin!==location.origin)return;
 if(!sp||S.runnerAssignmentId!==sp.id||String(req.assignment_id||'')!==String(sp.id))return;
 const nonce=typeof req.nonce==='string'?req.nonce:'';
 if(!/^[0-9a-f-]{36}$/i.test(nonce)||!S.session?.user?.id)return;
 try{
  // getSession uses the linked Supabase auth client and refreshes expiring
  // credentials without storing tokens in the runner HTML or its URL.
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session?.access_token||session.user?.id!==S.session.user.id){
   status('Staff session expired. Sign in again to save individualized program setup.','error');
   return;
  }
  // The user can change programs while an async refresh is taking place.
  if(S.programs[S.index]?.id!==sp.id||S.runnerAssignmentId!==sp.id||
     event.source!==frame.contentWindow)return;
  S.session=session;
  event.source.postMessage({
   type:'compass-auth-response',nonce,assignment_id:sp.id,
   access_token:session.access_token
  },event.origin);
 }catch(err){
  console.warn('COMPASS authenticated save handoff unavailable',err);
  status('Could not verify staff sign-in for this program. Retry Save Setup.','error');
 }
});
addEventListener('message',async e=>{
 if(e.source!==$('runnerFrame').contentWindow||e.origin!==location.origin)return;
 const msg=e.data||{},sp=S.programs[S.index];
 if(!usesV25Counting(sp))return;
 if(msg.type==='COMPASS_DEMO_V18_READY'){
  await sendV25Context(sp).catch(err=>status('Student context error: '+err.message,'error'));return;
 }
 if(msg.type==='COMPASS_DEMO_V18_NEXT_PROGRAM'){
  if(msg.studentId!==sp.student_id)return;
  if(S.index+1<S.programs.length)openAt(S.index+1);
  else status('Completed. This student has no next assigned program.','ok');
  return;
 }
 if(msg.type!=='COMPASS_DEMO_V18_EVENT'||msg.studentId!==sp.student_id)return;
 if(msg.event==='sync_requested'&&msg.payload?.kind==='run_completed'){
  void saveV25Run(sp,msg.payload);return;
 }
 if(msg.event==='context_ready'){status('COMPASS V25 linked to this student.','ok');return}
 if(msg.event==='run_completed'){status('Run saved on device; confirming COMPASS sync.');return}
 if(msg.event==='attention_upsert'){status('Interrupted run recorded on this device; central Needs Attention synchronization is not yet enabled.','error')}
});

})().catch(e=>{console.error(e);const s=document.getElementById('status');if(s){s.textContent=e.message||'Program Hub could not start.';s.className='status error'}})
