<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>COMPASS Student Program Hub</title>
<style>
:root{--navy:#17365d;--blue:#1677ff;--bg:#eef4fa;--line:#dbe6f2;--muted:#64748b;--green:#15803d;--red:#b42318}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}body{min-height:100dvh;overflow-y:auto;overflow-x:hidden}.app{min-height:100dvh;display:grid;grid-template-columns:320px minmax(0,1fr)}aside{position:sticky;top:0;height:100dvh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:18px;border-bottom:1px solid var(--line)}.brand h1{margin:0;font-size:23px}.brand small,.meta small{display:block;color:var(--muted);margin-top:5px}.meta{margin:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8fbff}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;padding:4px 7px;border:1px solid #c8dcf0;border-radius:999px;background:#eaf3ff}.search{margin:0 14px 10px;width:calc(100% - 28px);padding:10px;border:1px solid #cfddea;border-radius:9px}.list{flex:1;min-height:0;overflow-y:auto;padding:0 10px 14px;scrollbar-gutter:stable}.program{width:100%;display:grid;grid-template-columns:36px 1fr 18px;gap:8px;align-items:center;padding:9px;margin-bottom:6px;border:1px solid transparent;border-radius:10px;background:#fff;color:var(--navy);text-align:left;cursor:pointer}.program:hover{background:#f4f8fd;border-color:#d6e4f2}.program.active{background:#eaf4ff;border-color:#8fc0f4}.num{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#eef4fa;font-size:12px;font-weight:800}.program.active .num{background:var(--blue);color:#fff}.program strong,.program small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.program small{color:var(--muted);font-size:11px;margin-top:2px}main{min-width:0;min-height:100dvh}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}.title{min-width:0}.title h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions,.bottom{display:flex;gap:8px;align-items:center}.btn{padding:9px 12px;border:1px solid #bcd0e6;border-radius:9px;background:#fff;color:#145ea8;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.card{margin:14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.framewrap{position:relative;height:calc(100dvh - 165px);min-height:560px;background:#fff}.runner{display:block;width:100%;height:100%;border:0;background:#fff}.bottom{justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}.status{margin:0 14px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:12px}.status.ok{color:var(--green)}.status.error{color:var(--red);font-weight:700}.empty{height:100%;display:grid;place-items:center;padding:25px;text-align:center;color:var(--muted)}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#fff;color:var(--muted);font-weight:700}.loading[hidden]{display:none}
@media(max-width:850px){.app{display:block}.app aside{position:relative;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.list{max-height:34dvh}.top{flex-wrap:wrap}.actions{width:100%;justify-content:flex-end}.framewrap{height:70dvh;min-height:520px}}
</style></head><body><div class="app"><aside><div class="brand"><h1 id="studentName">Student Programs</h1><small>COMPASS Student Program Hub</small></div><div class="meta"><strong id="studentMeta">Loading student…</strong><small id="programCount">Loading assigned programs…</small><div id="behaviorPills" class="pills"></div></div><input id="search" class="search" type="search" placeholder="Search programs…"><div id="programList" class="list"></div></aside><main><div class="top"><div class="title"><h2 id="runnerTitle">Program Hub</h2><p id="runnerSubtitle">Choose a program from the left.</p></div><div class="actions"><button id="prevBtn" class="btn" disabled>← Previous</button><button id="nextBtn" class="btn primary" disabled>Next Program →</button><button id="closeBtn" class="btn">Close Hub</button></div></div><div class="card"><div class="framewrap"><div id="empty" class="empty"><div><strong>Select a program</strong><br>Choose one of this student's assigned programs.</div></div><div id="loading" class="loading" hidden>Loading program…</div><iframe id="runnerFrame" class="runner" title="COMPASS Program Runner" scrolling="auto" hidden></iframe></div><div class="bottom"><button id="bottomPrevBtn" class="btn" disabled>← Previous Program</button><button id="bottomNextBtn" class="btn primary" disabled>Next Program →</button></div></div><div id="status" class="status">Connecting to COMPASS…</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
const SUPABASE_URL='https://ykkexfsbnnxgncnyaksr.supabase.co',KEY='sb_publishable_3qkWcBut_bVwI6mlhOQOzA_50z_46cY',sb=supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),q=new URLSearchParams(location.search),studentId=q.get('student_id'),initial=q.get('assignment_id'),S={session:null,student:null,programs:[],index:-1,busy:false,blobUrl:null,loadSeq:0};
const status=(m,c='')=>{$('status').textContent=m;$('status').className='status '+c},nav=()=>{const a=S.index<=0,b=S.index<0||S.index>=S.programs.length-1;['prevBtn','bottomPrevBtn'].forEach(x=>$(x).disabled=a);['nextBtn','bottomNextBtn'].forEach(x=>$(x).disabled=b)};
function closeHub(){if(S.blobUrl){window.URL.revokeObjectURL(S.blobUrl);S.blobUrl=null}try{window.close()}catch(_){}setTimeout(()=>{if(!window.closed)location.assign('./')},80)}
function renderStudent(){const s=S.student||{},p=(Array.isArray(s.selected_behaviors)?s.selected_behaviors:[]).slice(0,5);$('studentName').textContent=s.display_label||s.student_code||'Student Programs';$('studentMeta').textContent=[s.grade_level&&('Grade '+s.grade_level),s.student_code].filter(Boolean).join(' · ')||'Assigned COMPASS Programs';$('programCount').textContent=`${S.programs.length} active assigned program${S.programs.length===1?'':'s'}`;$('behaviorPills').innerHTML=p.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
function renderList(){const z=$('search').value.trim().toLowerCase();$('programList').innerHTML=S.programs.map((x,i)=>{const n=x.program?.program_name||'Program',d=x.program?.program_config?.domain||x.program?.program_config?.category||x.program?.description||'';if(z&&!(`${n} ${d}`.toLowerCase().includes(z)))return'';return `<button class="program${i===S.index?' active':''}" data-index="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(n)}</strong><small>${esc(d)}</small></span><span>›</span></button>`}).join('')||'<div style="padding:12px;color:#64748b">No matching programs.</div>'}
function runtimeEndpoint(sp){return `${SUPABASE_URL}/functions/v1/compass-student-program-runtime?assignment_id=${encodeURIComponent(sp.id)}&token=${encodeURIComponent(sp.view_token||'')}&staff_id=${encodeURIComponent(S.session.user.id)}`}
async function runtimeBlobUrl(sp){const r=await fetch(runtimeEndpoint(sp),{cache:'no-store'});if(!r.ok)throw new Error('Program could not load ('+r.status+')');const buf=await r.arrayBuffer();if(!buf.byteLength)throw new Error('Program runtime was empty.');return window.URL.createObjectURL(new Blob([buf],{type:'text/html;charset=utf-8'}))}
async function openAt(i){if(i<0||i>=S.programs.length)return;const seq=++S.loadSeq;S.busy=true;S.index=i;renderList();nav();const sp=S.programs[i],name=sp.program?.program_name||'Program',frame=$('runnerFrame');$('runnerTitle').textContent=`${i+1} of ${S.programs.length}: ${name}`;$('runnerSubtitle').textContent='Student Program Hub · student behavior tracking active';$('empty').hidden=true;$('loading').hidden=false;frame.hidden=true;status('Loading '+name+'…');try{const url=await runtimeBlobUrl(sp);if(seq!==S.loadSeq){window.URL.revokeObjectURL(url);return}if(S.blobUrl)window.URL.revokeObjectURL(S.blobUrl);S.blobUrl=url;frame.onload=()=>{if(seq!==S.loadSeq)return;$('loading').hidden=true;frame.hidden=false;status(name+' ready.','ok');try{frame.contentWindow.scrollTo(0,0)}catch(_){}};frame.onerror=()=>{if(seq!==S.loadSeq)return;$('loading').hidden=true;frame.hidden=false;status(name+' could not render.','error')};frame.removeAttribute('srcdoc');frame.src=url;setTimeout(()=>{if(seq===S.loadSeq&&$('loading').hidden===false){$('loading').hidden=true;frame.hidden=false;status(name+' loaded; waiting for program scripts.','ok')}},3500)}catch(e){console.error(e);if(seq!==S.loadSeq)return;$('loading').hidden=true;frame.hidden=false;frame.removeAttribute('src');frame.srcdoc=`<div style="font-family:Arial;padding:28px;color:#b42318"><h2>Program could not open</h2><p>${esc(e.message||'Unknown error')}</p></div>`;status(e.message||'Program could not open.','error')}finally{if(seq===S.loadSeq){S.busy=false;nav()}}}
$('programList').onclick=e=>{const b=e.target.closest('[data-index]');if(b)openAt(Number(b.dataset.index))};$('search').oninput=renderList;['prevBtn','bottomPrevBtn'].forEach(x=>$(x).onclick=()=>openAt(S.index-1));['nextBtn','bottomNextBtn'].forEach(x=>$(x).onclick=()=>openAt(S.index+1));$('closeBtn').onclick=closeHub;addEventListener('message',e=>{if(e.source!==$('runnerFrame').contentWindow)return;if(e.data?.type==='compass-next-program')openAt(S.index+1);if(e.data?.type==='compass-previous-program')openAt(S.index-1);if(e.data?.type==='compass-program-session-saved')status('Program session saved to COMPASS.','ok')});
if(!studentId){status('No student was selected. Return to COMPASS and open Run Programs again.','error');return}const {data:{session}}=await sb.auth.getSession();if(!session?.user){status('COMPASS sign-in was not found in this tab. Return to the main site and reopen Run Programs.','error');return}S.session=session;const {data:student,error:se}=await sb.from('students').select('id,display_label,student_code,grade_level,selected_behaviors,secondary_behaviors,status').eq('id',studentId).maybeSingle();if(se||!student){status(se?.message||'Student could not be loaded.','error');return}S.student=student;const {data:assigned,error:ae}=await sb.from('student_compass_programs').select('id,student_id,program_id,view_token,status,display_order,goal_percentage').eq('student_id',studentId).eq('status','active').order('display_order',{ascending:true});if(ae){status(ae.message,'error');return}const ids=[...new Set((assigned||[]).map(x=>x.program_id).filter(Boolean))];let catalog=[];if(ids.length){const {data,error}=await sb.from('compass_programming_programs').select('id,program_code,program_name,description,program_config,active').in('id',ids);if(error){status(error.message,'error');return}catalog=data||[]}const map=new Map(catalog.map(p=>[p.id,p]));S.programs=(assigned||[]).map(x=>({...x,program:map.get(x.program_id)})).filter(x=>x.program).sort((a,b)=>(Number(a.display_order||0)-Number(b.display_order||0))||String(a.id).localeCompare(String(b.id)));renderStudent();renderList();nav();status(S.programs.length?'Programs loaded.':'This student has no active assigned programs.',S.programs.length?'ok':'');if(S.programs.length){const f=S.programs.findIndex(x=>x.id===initial),i=f>=0?f:0;setTimeout(()=>openAt(i),180)}
})().catch(e=>{console.error(e);const s=document.getElementById('status');if(s){s.textContent=e.message||'Program Hub could not start.';s.className='status error'}})
</script></body></html>
