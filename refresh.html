<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10396c"><title>Refresh COMPASS Website</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f2f7fb;color:#102f57;min-height:100vh;display:grid;place-items:center;padding:20px;margin:0}.panel{width:min(480px,100%);padding:32px;border-radius:20px;background:#fff;border:1px solid #d5e2ee;box-shadow:0 15px 40px #112d5012}h1{font-size:29px;margin:0 0 7px}.brand{font-size:34px;font-weight:900;color:#123f73;margin-bottom:24px}.muted{font-size:15px;line-height:1.5;color:#617994}button{padding:13px 18px;background:#236cdc;color:#fff;border:0;border-radius:11px;font:inherit;font-weight:800;width:100%;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{margin-top:16px;font-size:14px;line-height:1.5;min-height:20px}.fail{color:#af2533}
</style></head><body><main class="panel"><div class="brand">COMPASS</div><h1>Refresh the Website</h1><p class="muted">This refreshes the COMPASS app shell and navigation without deleting your login, saved student records, or unsynced offline sessions.</p><p class="muted">You must be online. Cached offline program resources may need to be downloaded again.</p><button id="refresh" type="button">Refresh COMPASS Now</button><div id="status" role="status" aria-live="polite"></div></main>
<script>
const button=document.getElementById('refresh'),status=document.getElementById('status');
button.addEventListener('click',async()=>{
button.disabled=true;status.textContent='Removing the old COMPASS website cache…';
try{
 if(!navigator.onLine){throw Error('Connect to the internet and try again.')}
 if('serviceWorker' in navigator){
  const registrations=await navigator.serviceWorker.getRegistrations();
  for(const registration of registrations){
   const scope=new URL(registration.scope).pathname;
   if(scope.endsWith('/Compass/'))await registration.unregister();
  }
 }
 if('caches' in window){
  for(const key of await caches.keys()){
   if(!key.startsWith('compass-shell-'))continue;
   const cache=await caches.open(key);
   const base=new URL('./',location.href);
   for(const path of ['','index.html','compass-admin-ui.js','sw.js']){
    await cache.delete(new Request(new URL(path,base).href),{ignoreSearch:true});
   }
  }
 }
 status.textContent='Opening the latest COMPASS navigation…';
 location.replace('./?caseload=20261025-canonical#caseload');
}catch(e){button.disabled=false;status.className='fail';status.textContent='The automatic refresh was interrupted: '+(e.message||String(e))+'. Please try again while online.'}
});
</script></body></html>
