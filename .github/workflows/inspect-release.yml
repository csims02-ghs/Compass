name: apply-iep-goal-fix

on:
  push:
    paths:
      - '.github/scripts/patch_iep_goals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch COMPASS
        run: python3 .github/scripts/patch_iep_goals.py
      - name: Validate loader syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=[]
          pos=0
          while True:
              a=s.find('<script>',pos)
              if a<0:
                  break
              b=s.find('</script>',a)
              if b<0:
                  raise SystemExit('unclosed script')
              scripts.append(s[a+8:b])
              pos=b+9
          Path('/tmp/index-loader.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-loader.js
      - name: Commit application fix
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No application changes needed."
            exit 0
          fi
          git config user.name "COMPASS Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Fix IEP goal save state and profile reload race"
          git push
