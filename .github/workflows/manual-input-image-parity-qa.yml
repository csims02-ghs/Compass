name: Manual Input image parity and data links
on:
  push:
    branches: [main, feature/manual-input-image-parity-connected]
    paths:
      - 'index.html'
      - 'manual-input-workspace.js'
      - 'manual-input-workspace.css'
      - 'manual-progress-sync.js'
      - 'compass-date-display.js'
      - 'qa/test-manual-input-image-parity.cjs'
      - 'qa/test-manual-progress-sync.cjs'
      - '.github/workflows/manual-input-image-parity-qa.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium
      - name: Manual Input form/history/CRUD/graph regression
        run: node qa/test-manual-input-image-parity.cjs
      - name: Student-specific Progress sync and clinical mastery separation
        run: node qa/test-manual-progress-sync.cjs
