name: COMPASS Stability Restore 2026-10-30 regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa/test-stability-restore-20261030.cjs'
      - '.github/workflows/compass-stability-restore.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qa/test-stability-restore-20261030.cjs'
      - '.github/workflows/compass-stability-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and transition guard
        run: node qa/test-stability-restore-20261030.cjs
      - name: Canonical shell / caseload regression
        run: node scripts/test-caseload-shell.cjs
