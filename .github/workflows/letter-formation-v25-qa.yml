name: Letter Formation V25 strict browser QA
on:
  push:
    branches: [qa/letter-formation-v25-strict]
  workflow_dispatch:
jobs:
  test-letter-formation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Strict synthetic QA without real student writes
        run: node qa/test-letter-formation-v25.cjs
