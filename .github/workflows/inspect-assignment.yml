name: apply-checkbox-assignment
on:
  push:
    paths:
      - '.github/workflows/inspect-assignment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch program assignment picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          index = Path('index.html')
          sw = Path('sw.js')
          s = index.read_text()
          tag = 'COMPASS checkbox assign programs v1'

          parts=['part01.txt','part02.txt','part03.txt','part04a.txt','part04b.txt','part04c.txt','part05.txt','part06.txt','part07.txt','part08a.txt','part08b.txt','part08c.txt','part09a.txt','part09b.txt','part09c.txt','part10a.txt','part10b.txt']
          blob=b''.join(base64.b64decode(''.join(Path('release/v20261010-3',p).read_text().split())) for p in parts)
          base_html=gzip.decompress(blob).decode()
          if base_html.count("function openAssignProgram(pre=''){") != 1:
              raise SystemExit('Base release assignment handler anchor changed')
          if base_html.count('function activeStudentProgramsOrdered(){') != 1:
              raise SystemExit('Base release assignment end anchor changed')

          replacement = r'''function openAssignProgram(pre=''){
            if(!state.currentStudent){toast('Open a student profile first.','error');return}
            const assigned=new Set(state.studentPrograms.filter(sp=>['active','hold','mastered'].includes(sp.status)).map(sp=>sp.program_id));
            const available=state.programCatalog.filter(p=>p.active!==false&&!assigned.has(p.id)).sort((a,b)=>String(a.program_name||'').localeCompare(String(b.program_name||'')));
            const rows=available.map(p=>`<label class="assign-program-choice" data-program-search="${esc(((p.program_name||'Program')+' '+programDomain(p)).toLowerCase())}"><input type="checkbox" name="assignProgramChoice" value="${p.id}"${p.id===pre?' checked':''}><span><strong>${esc(p.program_name||'Program')}</strong><small>${esc(programDomain(p))}</small></span></label>`).join('');
            openModal('Assign COMPASS Programs',`<form id="assignProgramForm" class="form-stack assign-program-form"><div class="assign-program-picker-head"><div><strong>Select Programs</strong><small>Check one or more programs to assign to this student.</small></div><strong id="assignProgramSelectedCount" class="assign-program-selected-count">0 selected</strong></div>${available.length?'<input id="assignProgramSearch" type="search" placeholder="Search available programs…"><div class="assign-program-picker-actions"><button id="assignProgramCheckAll" class="btn small" type="button">Check All</button><button id="assignProgramClear" class="btn small" type="button">Clear</button></div>':''}<div id="assignProgramPicker" class="assign-program-picker">${rows||'<div class="empty-state compact">All active COMPASS programs are already assigned to this student.</div>'}</div><div class="two-col"><label>Goal %<input id="assignProgramGoal" type="number" min="0" max="100" value="80"></label><label>Trials Per Session<input id="assignProgramTrials" type="number" min="1" max="100"></label></div><button class="btn primary assign-program-submit" type="submit"${available.length?'':' disabled'}>Assign Selected Programs</button></form>`,()=>{
              document.querySelector('.modal')?.classList.add('assign-program-modal');
              const checks=()=>qsa('#assignProgramPicker input[name="assignProgramChoice"]');
              const refreshCount=()=>{const n=checks().filter(c=>c.checked).length,el=$('assignProgramSelectedCount');if(el)el.textContent=n+' selected'};
              $('assignProgramSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();qsa('#assignProgramPicker .assign-program-choice').forEach(row=>row.classList.toggle('assign-program-filtered',!!q&&!String(row.dataset.programSearch||'').includes(q)))});
              $('assignProgramCheckAll')?.addEventListener('click',()=>{checks().filter(c=>!c.closest('.assign-program-filtered')).forEach(c=>c.checked=true);refreshCount()});
              $('assignProgramClear')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=false);refreshCount()});
              $('assignProgramPicker')?.addEventListener('change',refreshCount);
              refreshCount();
              $('assignProgramForm').addEventListener('submit',async e=>{
                e.preventDefault();
                const pids=checks().filter(c=>c.checked).map(c=>c.value);
                if(!pids.length){toast('Select at least one COMPASS program.','error');return}
                const visible=state.studentPrograms.filter(x=>x.status!=='archived');
                const max=Math.max(0,...visible.map(x=>Number(x.display_order||0)));
                const goal=Number($('assignProgramGoal').value||80),trials=$('assignProgramTrials').value?Number($('assignProgramTrials').value):null;
                const insertRows=pids.map((pid,i)=>({student_id:state.currentStudent.id,program_id:pid,assigned_by:state.user.id,status:'active',goal_percentage:goal,display_order:max+i+1,trials_per_session:trials}));
                const {error}=await sb.from('student_compass_programs').insert(insertRows);
                if(error){toast(error.message,'error');return}
                closeModal();toast(insertRows.length===1?'COMPASS program assigned.':insertRows.length+' COMPASS programs assigned.');await loadStudentProfile()
              })
            })
          }
          '''

          css = r'''<style id="compass-assign-checkbox-css">
          .assign-program-modal{width:min(760px,calc(100vw - 28px))!important}
          .assign-program-form{gap:12px!important}
          .assign-program-picker-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
          .assign-program-picker-head small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
          .assign-program-selected-count{white-space:nowrap;font-size:13px;color:var(--muted)}
          .assign-program-picker-actions{display:flex;gap:8px;align-items:center}
          .assign-program-picker{display:grid;gap:7px;max-height:min(48vh,430px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#f8fbff}
          .assign-program-choice{display:grid!important;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px!important;padding:9px 10px;border:1px solid #dbe5ef;border-radius:10px;background:#fff;cursor:pointer}
          .assign-program-choice:hover{border-color:#b9cbe0}
          .assign-program-choice input[type=checkbox]{width:18px!important;height:18px!important;min-width:18px!important;margin:0!important;padding:0!important}
          .assign-program-choice span{min-width:0}
          .assign-program-choice strong,.assign-program-choice small{display:block}
          .assign-program-choice strong{font-size:14px;overflow-wrap:anywhere}
          .assign-program-choice small{color:var(--muted);margin-top:2px}
          .assign-program-filtered{display:none!important}
          @media(max-width:600px){.assign-program-picker-head{align-items:flex-start;flex-direction:column}.assign-program-selected-count{align-self:flex-start}.assign-program-picker{max-height:46vh}.assign-program-modal{width:calc(100vw - 20px)!important}}
          </style>'''

          if tag not in s:
              marker = "  const listFnStart=html.indexOf('function openCreateProgramList(list=null){');"
              if s.count(marker) != 1:
                  raise SystemExit('Runtime patch insertion marker missing or duplicated')
              block = (
                  "  // " + tag + "\n"
                  "  const assignProgramStart=html.indexOf(\"function openAssignProgram(pre=''){\");\n"
                  "  const assignProgramEnd=html.indexOf('function activeStudentProgramsOrdered()',assignProgramStart);\n"
                  "  if(assignProgramStart<0||assignProgramEnd<0)throw new Error('COMPASS checkbox assignment check failed: handler not found');\n"
                  "  const assignProgramReplacement=" + json.dumps(replacement) + ";\n"
                  "  html=html.slice(0,assignProgramStart)+assignProgramReplacement+html.slice(assignProgramEnd);\n"
                  "  const assignProgramCss=" + json.dumps(css) + ";\n"
                  "  if(!html.includes('id=\\\"compass-assign-checkbox-css\\\"')){const assignHeadClose=html.indexOf('</head>');if(assignHeadClose<0)throw new Error('COMPASS checkbox assignment check failed: head not found');html=html.slice(0,assignHeadClose)+assignProgramCss+html.slice(assignHeadClose)}\n\n"
              )
              s = s.replace(marker, block + marker)
              index.write_text(s)

          w = sw.read_text()
          if "const CACHE='compass-shell-v25'" in w:
              w = w.replace("const CACHE='compass-shell-v25'", "const CACHE='compass-shell-v26'", 1)
          elif "const CACHE='compass-shell-v26'" not in w:
              raise SystemExit('Unexpected service worker cache version')
          sw.write_text(w)

          s=index.read_text()
          for needle in [tag,'assignProgramReplacement','assignProgramPicker','assignProgramChoice','Assign Selected Programs']:
              if needle not in s:
                  raise SystemExit('Missing checkbox assignment patch: '+needle)
          if "const CACHE='compass-shell-v26'" not in sw.read_text():
              raise SystemExit('Service worker cache was not bumped')
          Path('/tmp/assign-function.js').write_text(replacement)
          print('Checkbox assignment patch: PASS')
          PY
      - name: Validate JavaScript
        run: |
          node --check /tmp/assign-function.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=[]; pos=0
          while True:
              a=s.find('<script>',pos)
              if a<0: break
              b=s.find('</script>',a)
              if b<0: raise SystemExit('unclosed script')
              scripts.append(s[a+8:b]);pos=b+9
          Path('/tmp/index-loader.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-loader.js
      - name: Commit application change
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No application changes needed.'
            exit 0
          fi
          git config user.name 'COMPASS Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Restore checkbox program assignment picker'
          git push
