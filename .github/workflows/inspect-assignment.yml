name: inspect-assignment
on:
  push:
    paths:
      - '.github/workflows/inspect-assignment.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect assignment code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          parts=['part01.txt','part02.txt','part03.txt','part04a.txt','part04b.txt','part04c.txt','part05.txt','part06.txt','part07.txt','part08a.txt','part08b.txt','part08c.txt','part09a.txt','part09b.txt','part09c.txt','part10a.txt','part10b.txt']
          blob=b''.join(base64.b64decode(''.join(Path('release/v20261010-3',p).read_text().split())) for p in parts)
          s=gzip.decompress(blob).decode()
          needles=['Assign Program','assign-program','openAssign','student_compass_programs','programSelect','program-select']
          for n in needles:
              print('\n===== '+n+' =====')
              start=0; count=0
              while True:
                  i=s.find(n,start)
                  if i<0 or count>=12: break
                  print('\n--- match',count+1,'at',i,'---')
                  print(s[max(0,i-2200):min(len(s),i+5000)])
                  start=i+len(n);count+=1
          PY
