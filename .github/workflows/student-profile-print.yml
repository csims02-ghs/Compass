name: COMPASS Student Profile Print Stress Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'student-profile-print.js'
      - 'scripts/test-student-profile-print.cjs'
      - '.github/workflows/student-profile-print.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install report test dependencies
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          python3 -m pip install --user --quiet pypdf
          google-chrome --version
      - name: Verify script syntax
        run: |
          node --check student-profile-print.js
          node --check scripts/test-student-profile-print.cjs
      - name: Diagnose HTML generation
        run: PRINT_SCENARIO=populated PRINT_STAGE=html node scripts/test-student-profile-print.cjs
      - name: Diagnose report layout
        run: PRINT_SCENARIO=populated PRINT_STAGE=layout node scripts/test-student-profile-print.cjs
      - name: Diagnose displayed report values
        run: PRINT_SCENARIO=populated PRINT_STAGE=content node scripts/test-student-profile-print.cjs
      - name: Stress test populated student profile
        run: PRINT_SCENARIO=populated node scripts/test-student-profile-print.cjs
      - name: Stress test empty student data
        run: PRINT_SCENARIO=empty node scripts/test-student-profile-print.cjs
      - name: Stress test long student labels
        run: PRINT_SCENARIO=long-name node scripts/test-student-profile-print.cjs
      - name: Stress test partial prompt data
        run: PRINT_SCENARIO=partial-prompts node scripts/test-student-profile-print.cjs
      - name: Stress test unsafe student text
        run: PRINT_SCENARIO=unsafe-name node scripts/test-student-profile-print.cjs
