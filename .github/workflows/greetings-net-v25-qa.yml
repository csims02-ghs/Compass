name: Greetings NET V25 strict browser QA
on:
  push:
    branches: [qa/greetings-net-v25-chain-visual]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium
      - name: Greetings chain visual, NET fidelity and simulated save
        run: node qa/test-greetings-net-v25.cjs
