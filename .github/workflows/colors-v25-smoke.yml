name: Colors V25 stress test
on:
  push:
    branches: [main]
    paths:
      - 'compass-colors-v25.js'
      - 'compass-colors-v25.css'
      - 'compass-page2-standard.js'
      - 'index.html'
      - 'program-hub.html'
      - 'sw.js'
      - 'scripts/test-colors-v25-live.cjs'
      - '.github/workflows/colors-v25-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colors-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          google-chrome --version
      - name: Exercise live Colors source with V25 adapter
        run: node scripts/test-colors-v25-live.cjs
