name: One-Step Directions V25 strict browser QA
on:
  push:
    branches: [qa/one-step-directions-v25-strict]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium
      - name: Test clinical DTI and NET with save failure recovery
        run: node qa/test-one-step-directions-v25.cjs
