name: Manual Input full student history and CRUD QA
on:
  push:
    branches: [feature/manual-input-student-program-data]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium
      - name: Test manual and live history, student linking, edit and soft delete
        run: node qa/test-manual-input-workspace.cjs
