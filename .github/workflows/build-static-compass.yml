name: Build static COMPASS HTML
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static-compass.yml'
      - 'scripts/build-static.js'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single-pass COMPASS page
        run: |
          node --check scripts/build-static.js
          node scripts/build-static.js
      - name: Verify HTML and core features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          for marker in ('id="sidebar"', 'page-home', 'student_iep_goals','compass_program_sessions','assigned-program-iep-links.js','supabase'):
              assert marker in h, marker
          assert len(h)>100000, len(h)
          assert 'Loading COMPASS 1/' not in h
          print('Static HTML ready:',len(h),'characters')
          PY
      - name: Commit the final HTML directly
        run: |
          git config user.name "COMPASS Build"
          git config user.email "compass-build@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to static HTML"
          else
            git commit -m "Build direct COMPASS HTML with IEP and trial integration [skip ci]"
            git push
          fi
