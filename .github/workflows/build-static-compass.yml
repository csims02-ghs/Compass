name: Validate canonical COMPASS HTML shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static-compass.yml'
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-caseload-shell.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production source of truth
        run: |
          node --check scripts/test-caseload-shell.cjs
          node scripts/test-caseload-shell.cjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for required in ('id="sidebar"','page-home','student_iep_goals','compass_program_sessions','assigned-program-iep-links.js','supabase'):
            assert required in s,required
          assert len(s)>100000,len(s)
          print('CANONICAL_SHELL_SAFE',len(s))
          PY
# scripts/build-static.js and the nested loader HTMLs are archival sources.
# They are intentionally NOT run by this workflow: they regenerate older code
# and must not overwrite the hand-maintained canonical production index.html.
