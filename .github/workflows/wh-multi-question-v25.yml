name: WH Concepts mixed and focused questions V25
on:
  pull_request:
    paths:
      - 'scripts/test-wh-multi-question-v25.cjs'
      - '.github/workflows/wh-multi-question-v25.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test-wh-multi-question-v25.cjs'
      - '.github/workflows/wh-multi-question-v25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wh-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
      - name: Verify WH mixed and focused V25 story questions and synthetic saves
        run: node scripts/test-wh-multi-question-v25.cjs
      - name: Re-run existing WH N/A and three-choice regression test
        run: node scripts/test-wh-smooth-array-v25.cjs
