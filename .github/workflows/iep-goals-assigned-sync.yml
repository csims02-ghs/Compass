name: COMPASS IEP Goals and Assigned Programs synchronization
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test-iep-goals-assigned-sync.cjs'
      - '.github/workflows/iep-goals-assigned-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goal-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          google-chrome --version
      - name: Verify Goal selections match assigned program labels
        run: node scripts/test-iep-goals-assigned-sync.cjs
