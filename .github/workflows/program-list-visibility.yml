name: COMPASS program list visibility guard
on:
  pull_request:
    paths:
      - 'index.html'
      - 'qa/test-program-list-visibility.cjs'
      - '.github/workflows/program-list-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa/test-program-list-visibility.cjs'
      - '.github/workflows/program-list-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Program catalog and student profile visibility
        run: node qa/test-program-list-visibility.cjs
