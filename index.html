<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>COMPASS Student Support</title>
  <style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f7fb;color:#10396c;display:grid;place-items:center;min-height:100vh}.loading{font-weight:800}</style>
</head>
<body>
  <div class="loading">Opening COMPASS…</div>
  <script>
    (async function(){
      const hash=window.location.hash||'';
      const search=window.location.search||'';
      const recovery=/type=recovery/i.test(hash+search)||/access_token=/i.test(hash);
      if(recovery){
        window.location.replace('./reset.html'+search+hash);
        return;
      }

      try{
        const purgeKey='compass-student-purge-20261009';
        if(localStorage.getItem(purgeKey)!=='done'){
          try{indexedDB.deleteDatabase('compass-offline-v1')}catch(e){}
          if('caches' in window){
            try{
              const keys=await caches.keys();
              await Promise.all(keys.filter(k=>k.startsWith('compass-shell-')).map(k=>caches.delete(k)));
            }catch(e){}
          }
          localStorage.setItem(purgeKey,'done');
        }

        const response=await fetch('./COMPASS_WITH_OFFLINE_PROGRAM_LISTS.html?app=edge-create-student-20261009',{cache:'no-store'});
        if(!response.ok) throw new Error('Unable to load COMPASS application');
        let html=await response.text();

        html=html.replaceAll(
          "let rows=[...state.caseloadRows];if(!isAdmin()){const mine=rows.filter(r=>r.provider_user_id===state.user.id);if(mine.length)rows=mine}",
          "let rows=[...state.caseloadRows].filter(r=>r.provider_user_id===state.user.id);"
        );

        html=html.replaceAll(
          "state.caseloadStudents=list.length?list:(isAdmin()?[...state.students]:[]);",
          "state.caseloadStudents=list;"
        );

        html=html.replaceAll(
          "const students=state.caseloadStudents.length?state.caseloadStudents:state.students",
          "const students=state.caseloadStudents"
        );

        const createStart=html.indexOf('function openCreateStudent(){');
        const createEnd=html.indexOf('function openEditStudent(){',createStart);
        if(createStart<0||createEnd<0) throw new Error('Create Student handler was not found');

        const createStudentReplacement="function openCreateStudent(){const groups=state.schools.map(s=>'<optgroup label=\"'+esc(s.name)+'\">'+state.classrooms.filter(c=>c.school_id===s.id).map(c=>'<option value=\"'+c.id+'\">'+esc(c.name)+'</option>').join('')+'</optgroup>').join('');openModal('Add Student','<form id=\"createStudentForm\" class=\"form-stack\"><label>Student Display Name / Label<input id=\"newStudentLabel\" required></label><label>Student ID / Code<input id=\"newStudentCode\" required></label><label>Grade Level<input id=\"newStudentGrade\"></label><label>Classroom<select id=\"newStudentClassroom\" required><option value=\"\">Choose classroom…</option>'+groups+'</select></label><label>Enrollment Date<input id=\"newStudentEnrollment\" type=\"date\" value=\"'+todayISO()+'\"></label><button class=\"btn primary\" type=\"submit\">Create Student</button></form>',()=>{$('createStudentForm').addEventListener('submit',async e=>{e.preventDefault();const submit=e.submitter;if(submit){submit.disabled=true;submit.textContent='Creating…'}try{const {data:refreshData,error:refreshError}=await sb.auth.refreshSession();if(refreshError||!refreshData?.session?.access_token){toast('Your COMPASS sign-in session expired. Sign in again before adding a student.','error');return}state.user=refreshData.session.user;const row={display_label:$('newStudentLabel').value.trim(),student_code:$('newStudentCode').value.trim(),grade_level:$('newStudentGrade').value.trim()||null,classroom_id:$('newStudentClassroom').value,enrollment_date:$('newStudentEnrollment').value||null};const {data,error}=await sb.functions.invoke('compass-admin-create-student',{body:row,headers:{Authorization:'Bearer '+refreshData.session.access_token}});if(error||data?.error){let message=data?.error||error?.message||'Student creation failed';try{if(error?.context?.clone){const detail=await error.context.clone().json();message=detail?.error||detail?.message||message}}catch(_){}toast(message,'error');return}const student=data?.student;if(!student?.id){toast('Student creation returned no student record.','error');return}closeModal();toast('Student created.','success');await refreshReferences();openStudent(student.id)}finally{if(submit){submit.disabled=false;submit.textContent='Create Student'}}})})}\n  ";

        html=html.slice(0,createStart)+createStudentReplacement+html.slice(createEnd);

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div style="max-width:620px;padding:28px"><h1>COMPASS could not open</h1><p>'+String(err.message||err)+'</p><button onclick="location.reload()">Retry</button></div>';
      }
    })();
  </script>
</body>
</html>
