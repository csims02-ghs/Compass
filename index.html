<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1727">
  <title>COMPASS</title>
  <style>html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#10243a}body{display:grid;place-items:center}.card{max-width:560px;margin:24px;padding:28px 30px;border:1px solid #dbe5ef;border-radius:18px;background:#fff;box-shadow:0 12px 38px rgba(13,34,56,.08);text-align:center}.brand{font-weight:800;letter-spacing:.05em;font-size:24px;margin-bottom:8px}.status{font-size:14px;color:#5f7388;line-height:1.5}.error{color:#9f1d20;font-weight:700}</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite"><div class="brand">COMPASS</div><div class="status" id="status">Opening COMPASS…</div></main>
<script>
(async()=>{
  const VERSION='v20261010-3';
  const BASE_EXPECTED='cf0bda37c623f1599ff73c1a751284946261fa3472b11abe7a4917afe9cd93b0';
  const FILES=["part01.txt","part02.txt","part03.txt","part04a.txt","part04b.txt","part04c.txt","part05.txt","part06.txt","part07.txt","part08a.txt","part08b.txt","part08c.txt","part09a.txt","part09b.txt","part09c.txt","part10a.txt","part10b.txt"];
  const PATCHES=[
    ["<nav class=\"nav\"><button data-page=\"calendar\">Calendar</button><button data-page=\"settings\">Settings</button></nav>","<nav class=\"nav\"><button data-page=\"settings\">Settings</button></nav>","sidebar Calendar"],
    ["<option value=\"data-collection\">Data Collection</option><option value=\"calendar\">Calendar</option>","<option value=\"data-collection\">Data Collection</option>","Browse Calendar"],
    ["                <button class=\"link-btn schedule-calendar-link\" type=\"button\" data-page=\"calendar\">View full calendar →</button>\n","","View full calendar"],
    ["<button id=\"homeCalendarAddEvent\" class=\"btn primary small\" type=\"button\">+ Add Event</button><button class=\"btn small\" type=\"button\" data-page=\"calendar\">Open Calendar</button>","<button id=\"homeCalendarAddEvent\" class=\"btn primary small\" type=\"button\">+ Add Event</button>","Open Calendar"],
    ["<section id=\"page-calendar\" class=\"page\"><div class=\"content calendar-content\"><div class=\"calendar-head\"><div class=\"calendar-controls\"><button id=\"calendarPrev\" class=\"btn primary\" type=\"button\">‹</button><button id=\"calendarNext\" class=\"btn primary\" type=\"button\">›</button><button id=\"calendarToday\" class=\"btn\" type=\"button\">Today</button></div><h1 id=\"calendarTitle\">Calendar</h1><button id=\"addEventBtn\" class=\"btn primary\" type=\"button\">+ Add Event</button></div><div id=\"calendarGrid\" class=\"calendar-grid\"></div></div></section>","","standalone Calendar page"],
    ["function renderCalendar(){renderCalendarInto('calendarTitle','calendarGrid');renderCalendarInto('homeCalendarTitle','homeCalendarGrid');showTodayInHomeCalendar()}","function renderCalendar(){renderCalendarInto('homeCalendarTitle','homeCalendarGrid');showTodayInHomeCalendar()}","calendar renderer"],
    ["function showPage(name,push=true){if(name==='student-search'||name==='student-directory')name='students';","function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';","Calendar route redirect"],
    ["$('calendarPrev').addEventListener('click',()=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()-1,1);renderCalendar()});$('calendarNext').addEventListener('click',()=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+1,1);renderCalendar()});$('calendarToday').addEventListener('click',()=>{state.calendarDate=new Date();renderCalendar()});$('calendarGrid').addEventListener('dblclick',e=>{const d=e.target.closest('.cal-day');if(d&&!e.target.closest('[data-event-id]'))openEventModal(d.dataset.date)});\n  ","","standalone Calendar listeners"],
    ["$('addEventBtn').addEventListener('click',()=>openEventModal());","","standalone Add Event listener"],
    ["function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';qsa('.page').forEach(p=>p.classList.remove('active'));const p=$('page-'+name);if(!p)return;p.classList.add('active');qsa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(push)location.hash=name;$('sidebar').classList.remove('open');window.scrollTo({top:0});if(name==='students')renderDirectory();if(name==='data-collection')loadDataCollection();if(name==='offline-programs')renderOfflinePage();if(name==='home')showTodayInHomeCalendar()}","function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';const p=$('page-'+name);if(!p)return;const siblings=p.parentElement?Array.from(p.parentElement.children).filter(el=>el.id&&el.id.startsWith('page-')):[];const candidates=new Set([...qsa('.page'),...siblings]);const home=$('page-home');if(home)candidates.add(home);candidates.forEach(page=>{const active=page===p;page.classList.toggle('active',active);page.hidden=!active;if(active){page.style.removeProperty('display')}else{page.style.setProperty('display','none','important')}});document.body.dataset.compassPage=name;document.body.classList.toggle('compass-home-active',name==='home');qsa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(push)location.hash=name;$('sidebar').classList.remove('open');window.scrollTo({top:0});if(name==='students')renderDirectory();if(name==='data-collection')loadDataCollection();if(name==='offline-programs')renderOfflinePage();if(name==='home')showTodayInHomeCalendar()}","isolated page controller"]
  ];
  const status=document.getElementById('status');
  let b64='';
  for(let i=0;i<FILES.length;i++){
    const name=FILES[i];
    status.textContent=`Loading COMPASS ${i+1}/${FILES.length}…`;
    const r=await fetch(`./release/${VERSION}/${name}?release=${VERSION}-student-programs-only-v7`,{cache:'no-store'});
    if(!r.ok)throw new Error(`Release file ${name} failed to load (${r.status})`);
    b64+=(await r.text()).trim();
  }
  const binary=atob(b64),zipped=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)zipped[i]=binary.charCodeAt(i);
  if(typeof DecompressionStream!=='function')throw new Error('This browser cannot open the verified COMPASS release. Please update the browser.');
  const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
  const hex=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',value)),b=>b.toString(16).padStart(2,'0')).join('');
  if(await hex(bytes)!==BASE_EXPECTED)throw new Error('COMPASS release integrity check failed. Refresh before continuing.');
  let html=new TextDecoder().decode(bytes);
  for(const [from,to,label] of PATCHES){
    const first=html.indexOf(from);
    if(first<0||html.indexOf(from,first+from.length)>=0)throw new Error(`COMPASS page-scope check failed: ${label}`);
    html=html.replace(from,to);
  }
  const listFnStart=html.indexOf('function openCreateProgramList(list=null){');
  const listFnEnd=html.indexOf('async function archiveProgramList',listFnStart);
  if(listFnStart<0||listFnEnd<0)throw new Error('COMPASS program-list picker check failed: handler not found');
  const programListReplacement="function openCreateProgramList(list=null){\n    if(!state.currentStudent){toast('Open a student first.','error');return}\n    const active=[...state.studentPrograms].filter(sp=>sp.status==='active'&&sp.student_id===state.currentStudent.id).sort((a,b)=>(Number(a.display_order||0)-Number(b.display_order||0))||String(a.id).localeCompare(String(b.id)));\n    const existing=list?new Map(listItems(list.id).map(x=>[x.student_compass_program_id,x.display_order])):new Map();\n    const cards=active.map((sp,i)=>{\n      const p=programById(sp.program_id),checked=existing.has(sp.id),order=existing.get(sp.id)||i+1;\n      return `<label class=\"program-list-check program-library-check\" data-program-search=\"${esc(((p?.program_name||'Program')+' '+programDomain(p)).toLowerCase())}\"><input type=\"checkbox\" name=\"programListProgram\" value=\"${sp.id}\"${checked?' checked':''}><input type=\"number\" name=\"programListOrder-${sp.id}\" min=\"1\" value=\"${order}\" aria-label=\"Order for ${esc(p?.program_name||'Program')}\"><span><strong>${esc(p?.program_name||'Program')}</strong><small>${esc(programDomain(p))}</small></span></label>`;\n    }).join('');\n    openModal(list?'Edit Program List':'Create Program List',`<form id=\"programListForm\" class=\"form-stack program-list-library-form\"><label>List Name<input id=\"programListName\" value=\"${esc(list?.name||'Daily Programs')}\" required></label><div><div class=\"program-list-picker-head\"><div><strong>Select This Student's Programs and Order</strong><p class=\"muted\">Choose from ${esc(studentLabel(state.currentStudent))}'s active assigned programs. Use the order number to set the sequence.</p></div><strong id=\"programListSelectedCount\" class=\"program-list-selected-count\">0 selected</strong></div>${active.length?`<input id=\"programListSearch\" class=\"program-list-search\" type=\"search\" placeholder=\"Search this student's ${active.length} active program${active.length===1?'':'s'}…\"><div class=\"program-list-picker-actions\"><button id=\"programListCheckAll\" class=\"btn small\" type=\"button\">Check All</button><button id=\"programListClearChecks\" class=\"btn small\" type=\"button\">Clear Checks</button></div>`:''}<div id=\"programListPicker\" class=\"program-list-picker\">${cards||'<div class=\"muted\">This student has no active assigned programs. Use <strong>+ Assign Program</strong> first.</div>'}</div></div><button class=\"btn primary\" type=\"submit\"${active.length?'':' disabled'}>${list?'Save List':'Create Program List'}</button></form>`,()=>{\n      document.querySelector('.modal')?.classList.add('program-list-library-modal');\n      const checks=()=>qsa('#programListPicker input[name=\"programListProgram\"]');\n      const refreshCount=()=>{const el=$('programListSelectedCount');if(el)el.textContent=checks().filter(c=>c.checked).length+' selected'};\n      $('programListSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();qsa('#programListPicker .program-library-check').forEach(row=>row.classList.toggle('program-list-filtered',!!q&&!String(row.dataset.programSearch||'').includes(q)))});\n      $('programListCheckAll')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=true);refreshCount()});\n      $('programListClearChecks')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=false);refreshCount()});\n      $('programListPicker')?.addEventListener('change',refreshCount);\n      refreshCount();\n      $('programListForm').addEventListener('submit',async e=>{\n        e.preventDefault();\n        const selected=checks().filter(c=>c.checked).map((c,index)=>({id:c.value,order:Number(document.querySelector(`[name=\"programListOrder-${c.value}\"]`)?.value||999),index})).sort((a,b)=>(a.order-b.order)||(a.index-b.index));\n        if(!selected.length){toast('Select at least one program.','error');return}\n        let listId=list?.id;\n        if(listId){\n          const {error}=await sb.from('student_program_lists').update({name:$('programListName').value.trim(),updated_at:new Date().toISOString()}).eq('id',listId).eq('student_id',state.currentStudent.id);\n          if(error){toast(error.message,'error');return}\n          const {error:de}=await sb.from('student_program_list_items').delete().eq('list_id',listId);\n          if(de){toast(de.message,'error');return}\n        }else{\n          const {data,error}=await sb.from('student_program_lists').insert({student_id:state.currentStudent.id,name:$('programListName').value.trim(),created_by:state.user.id,status:'active'}).select('*').single();\n          if(error){toast(error.message,'error');return}\n          listId=data.id\n        }\n        const rows=selected.map((x,i)=>({list_id:listId,student_compass_program_id:x.id,display_order:i+1}));\n        const {error:itemErr}=await sb.from('student_program_list_items').insert(rows);\n        if(itemErr){toast(itemErr.message,'error');return}\n        await idbDelete('lists',listId).catch(()=>{});\n        closeModal();toast(list?'Program List updated.':'Program List created.');\n        await loadProgramLists()\n      })\n    })\n  }\n  ";
  html=html.slice(0,listFnStart)+programListReplacement+html.slice(listFnEnd);
  const scopeStyle='<style id="compass-page-isolation-scope">[id^="page-"][hidden]{display:none!important}body[data-compass-page]:not([data-compass-page="home"]) #page-home{display:none!important}#page-home:not(.active) .home-schedule-card,#page-home:not(.active) .home-calendar-card,body:not(.compass-home-active) .home-schedule-card,body:not(.compass-home-active) .home-calendar-card{display:none!important}</style>';
  const programListStyle="<style id=\"compass-program-list-library-picker\">\n.program-list-library-modal{width:min(940px,94vw)!important}\n.program-list-library-modal .modal-body{padding:18px 20px!important;overflow:hidden!important}\n.program-list-library-form{max-height:calc(90vh - 92px);min-height:0}\n.program-list-picker-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}\n.program-list-picker-head p{margin:4px 0 0}\n.program-list-selected-count{white-space:nowrap;color:var(--blue);font-size:13px}\n.program-list-search{width:100%;margin:10px 0 8px}\n.program-list-picker-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}\n.program-list-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:430px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:8px;border:1px solid var(--line);border-radius:12px;background:#f7faff}\n.program-list-picker .program-list-check{grid-template-columns:auto 54px minmax(0,1fr);background:#fff;min-width:0;margin:0}\n.program-list-picker .program-list-check input[type=checkbox]{width:18px;height:18px;margin:0}\n.program-list-picker .program-list-check input[type=number]{width:54px}\n.program-list-picker .program-list-check span{min-width:0}\n.program-list-picker .program-list-check strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.program-list-picker .program-list-check small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.program-list-filtered{display:none!important}\n@media(max-width:760px){.program-list-library-modal{width:min(680px,96vw)!important}.program-list-picker{grid-template-columns:1fr;max-height:55vh}.program-list-picker-head{flex-direction:column;gap:6px}}\n</style>";
  const headClose=html.indexOf('</head>');
  if(headClose<0)throw new Error('COMPASS page-scope check failed: document head');
  html=html.slice(0,headClose)+scopeStyle+programListStyle+html.slice(headClose);
  if(html.includes('id="page-calendar"'))throw new Error('COMPASS page-scope check failed: Calendar page still present');
  if(!html.includes("document.body.dataset.compassPage=name"))throw new Error('COMPASS page-scope check failed: route ownership');
  if(!html.includes("page.style.setProperty('display','none','important')"))throw new Error('COMPASS page-scope check failed: inactive page visibility');
  if(!html.includes('id="compass-page-isolation-scope"'))throw new Error('COMPASS page-scope check failed: isolation CSS');
  if(!html.includes('id="compass-program-list-library-picker"'))throw new Error('COMPASS program-list picker check failed: style missing');
  if(!html.includes('program-list-library-modal'))throw new Error('COMPASS program-list picker check failed: modal missing');
  if(!html.includes("sp.student_id===state.currentStudent.id"))throw new Error('COMPASS student-program scope check failed');
  document.open();document.write(html);document.close();
})().catch(err=>{console.error(err);const status=document.getElementById('status');if(status){status.className='status error';status.textContent=err&&err.message?err.message:'COMPASS could not be opened safely. Refresh and try again.';}});
</script>
</body>
</html>
