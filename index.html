<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1727">
  <title>COMPASS</title>
  <style>html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#10243a}body{display:grid;place-items:center}.card{max-width:560px;margin:24px;padding:28px 30px;border:1px solid #dbe5ef;border-radius:18px;background:#fff;box-shadow:0 12px 38px rgba(13,34,56,.08);text-align:center}.brand{font-weight:800;letter-spacing:.05em;font-size:24px;margin-bottom:8px}.status{font-size:14px;color:#5f7388;line-height:1.5}.error{color:#9f1d20;font-weight:700}</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite"><div class="brand">COMPASS</div><div class="status" id="status">Opening COMPASS…</div></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const response=await fetch('./index-profile-charts-v5-20261017.html?tabs=v9',{cache:'no-store'});
  if(!response.ok)throw new Error('COMPASS profile source could not be opened ('+response.status+').');
  let source=await response.text();

  const mediaNeedle="    @media(max-width:1100px){.compass-profile-four-card-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}";
  const tabCss=`    .compass-profile-tabs-v7{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;align-items:stretch!important;width:100%!important;max-width:none!important;gap:0!important;overflow:visible!important}\n    .compass-profile-tabs-v7>button,.compass-profile-tabs-v7>[role="tab"]{min-width:0!important;width:100%!important;max-width:none!important;margin:0!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;white-space:normal!important;line-height:1.15!important;padding-left:8px!important;padding-right:8px!important}\n    @media(max-width:1500px){.compass-profile-tabs-v7{grid-template-columns:repeat(6,minmax(0,1fr))!important}.compass-profile-tabs-v7>button,.compass-profile-tabs-v7>[role="tab"]{min-height:54px!important;padding:10px 6px!important;font-size:13px!important}}\n`;
  if(source.includes(mediaNeedle))source=source.replace(mediaNeedle,tabCss+mediaNeedle);else console.warn('COMPASS tab CSS target not found; opening base profile layout.');

  const ensureMarker='  function compassEnsureGraphsChartsTab(){';
  const layoutFn=`  function compassLayoutProfileTabs(root,overviewButton){\n    if(!overviewButton||!overviewButton.parentElement)return;\n    const nav=overviewButton.parentElement;\n    nav.classList.add('compass-profile-tabs-v7');\n    const order=['Overview','IEP & Services','Programs','Goals','Behavior','Graphs and Charts','Progress','Assessments','Observation & Session Notes','Documents','Team','History'];\n    const norm=function(v){return String(v||'').trim().toLowerCase()};\n    order.forEach(function(label){\n      const key=norm(label);\n      const btn=Array.from(nav.children).find(function(el){return el.matches&&el.matches('button,[role="tab"]')&&norm(el.textContent)===key});\n      if(btn)nav.appendChild(btn);\n    });\n  }\n`;
  if(source.includes(ensureMarker))source=source.replace(ensureMarker,layoutFn+ensureMarker);else console.warn('COMPASS tab layout function target not found.');

  const createNeedle="if(overviewButton){tab=overviewButton.cloneNode(true);Array.from(tab.attributes).forEach(function(a){if(a.name==='id'||a.name.indexOf('data-')===0||a.name==='aria-controls')tab.removeAttribute(a.name)});tab.textContent='Graphs and Charts';tab.dataset.compassGraphsTab='1';tab.id='compassGraphsChartsTab';tab.setAttribute('aria-selected','false');overviewButton.insertAdjacentElement('afterend',tab)}";
  const createReplacement="if(overviewButton){tab=overviewButton.cloneNode(true);Array.from(tab.attributes).forEach(function(a){if(a.name==='id'||a.name.indexOf('data-')===0||a.name==='aria-controls')tab.removeAttribute(a.name)});tab.textContent='Graphs and Charts';tab.dataset.compassGraphsTab='1';tab.id='compassGraphsChartsTab';tab.setAttribute('aria-selected','false');tab.classList.remove('active','selected');const behaviorButton=buttons.find(function(b){return String(b.textContent||'').trim().toLowerCase()==='behavior'});if(behaviorButton&&behaviorButton.parentElement===overviewButton.parentElement)behaviorButton.insertAdjacentElement('afterend',tab);else overviewButton.insertAdjacentElement('afterend',tab)}";
  if(source.includes(createNeedle))source=source.replace(createNeedle,createReplacement);else console.warn('COMPASS Graphs and Charts insertion target not found.');

  const returnNeedle='    return {tab:tab,pane:pane,overviewButton:overviewButton,overviewPanel:overviewPanel};';
  const returnReplacement=`    if(tab){tab.classList.remove('selected');if(overviewButton&&overviewButton.classList.contains('active')){tab.classList.remove('active');tab.setAttribute('aria-selected','false');if(pane){pane.hidden=true;pane.style.setProperty('display','none','important')}}}\n    compassLayoutProfileTabs(root,overviewButton);\n    return {tab:tab,pane:pane,overviewButton:overviewButton,overviewPanel:overviewPanel};`;
  if(source.includes(returnNeedle))source=source.replace(returnNeedle,returnReplacement);else console.warn('COMPASS tab finalizer target not found.');

  const programStart=source.indexOf('  function compassRenderProgramChart(el,label,entries){');
  const programEnd=source.indexOf('  async function renderGoalAchievement(){',programStart);
  if(programStart>=0&&programEnd>programStart){
    const progressReplacement=`  function compassRenderProgramChart(el,label,entries){\n    if(!el||!label)return;\n    const pane=document.getElementById('compassGraphsChartsPane'),heading=pane&&pane.querySelector('h2');if(heading)heading.textContent='Program Progress';\n    if(!Array.isArray(entries)||!entries.length){label.textContent='No programs linked to IEP goals';el.innerHTML='<div class="chart-empty">No IEP-linked student programs are available.</div>';return}\n    const allSessions=Array.isArray(state.sessions)?state.sessions:[];\n    let selected=entries.find(function(e){return String(e.sp&&e.sp.id||'')===String(el.dataset.programProgressId||'')});\n    if(!selected)selected=entries.find(function(e){return allSessions.some(function(s){return String(s.student_compass_program_id||'')===String(e.sp&&e.sp.id||'')})})||entries[0];\n    const selectedId=String(selected.sp&&selected.sp.id||'');el.dataset.programProgressId=selectedId;\n    const byDay=new Map();\n    allSessions.filter(function(s){return String(s.student_compass_program_id||'')===selectedId}).forEach(function(s){\n      const raw=s.session_date||s.ended_at||s.created_at||'',date=String(raw).slice(0,10);if(!date)return;\n      const cur=byDay.get(date)||{date:date,trials:0,correct:0,behaviors:0};cur.trials+=Number(s.trials_total||0);cur.correct+=Number(s.targets_correct||0);cur.behaviors+=Number(s.total_behaviors||0);byDay.set(date,cur);\n    });\n    const days=Array.from(byDay.values()).sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(d){d.achieved=d.trials?Math.round((100*d.correct/d.trials)*10)/10:null;return d});\n    const options=entries.map(function(e){const id=String(e.sp&&e.sp.id||''),sel=id===selectedId?' selected':'';return '<option value="'+esc(id)+'"'+sel+'>'+esc(e.programName)+'</option>'}).join('');\n    const selector='<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#17365d">Program <select id="compassProgramProgressSelect" style="min-width:240px;max-width:420px;border:1px solid #cbd7e6;border-radius:8px;padding:8px 10px;background:#fff;color:#17365d;font-weight:600">'+options+'</select></label>';\n    if(!days.length){label.textContent=selected.programName+' · No session data yet';el.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'+selector+'</div><div class="chart-empty">No dated session data has been recorded for '+esc(selected.programName)+' yet.</div>';const emptySelect=el.querySelector('#compassProgramProgressSelect');if(emptySelect)emptySelect.addEventListener('change',function(){el.dataset.programProgressId=this.value;compassRenderProgramChart(el,label,entries)});return}\n    const target=Math.max(0,Math.min(100,Number(selected.target)||0)),blue='#3f7ff5',red='#f04438',yellow='#f5ad00',grid='#d1d5db',ink='#202124',muted='#6b7280';\n    const maxBehavior=Math.max.apply(null,days.map(function(d){return Number(d.behaviors)||0}).concat([0])),rightMax=Math.max(4,Math.ceil(maxBehavior/2)*2);\n    const left=80,right=72,top=95,plotBottom=390,plotH=235,bottom=115,step=88,width=Math.max(1100,left+right+Math.max(2,days.length)*step),height=top+plotH+bottom,plotW=width-left-right;\n    const x=function(i){return days.length===1?left+plotW/2:left+(plotW*i/(days.length-1))},yPct=function(v){return plotBottom-plotH*(Math.max(0,Math.min(100,Number(v)||0))/100)},yBeh=function(v){return plotBottom-plotH*(Math.max(0,Math.min(rightMax,Number(v)||0))/rightMax)},fmt=function(v){const p=String(v||'').split('-');return p.length===3?(Number(p[1])+'/'+Number(p[2])+'/'+p[0]):String(v||'')};\n    const leftTicks=[0,25,50,75,100].map(function(v){const y=yPct(v);return '<line x1="'+left+'" y1="'+y+'" x2="'+(width-right)+'" y2="'+y+'" stroke="'+grid+'"/><text x="'+(left-10)+'" y="'+(y+5)+'" text-anchor="end" fill="'+ink+'" font-size="13">'+v.toFixed(2)+'%</text>'}).join('');\n    const rightTicks=[0,1,2,3,4].map(function(i){const v=rightMax*i/4,y=yBeh(v);return '<text x="'+(width-right+12)+'" y="'+(y+5)+'" fill="'+ink+'" font-size="13">'+(Math.round(v*100)/100)+'</text>'}).join('');\n    const aPts=days.map(function(d,i){return d.achieved==null?null:{x:x(i),y:yPct(d.achieved),v:d.achieved,date:d.date}}).filter(Boolean),aPath=aPts.length>1?'<polyline points="'+aPts.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="'+blue+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':'',aDots=aPts.map(function(p){return '<g><circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="'+blue+'"><title>'+esc(fmt(p.date)+' Achieved '+p.v.toFixed(1)+'%')+'</title></circle><text x="'+p.x+'" y="'+(p.y-12)+'" text-anchor="middle" fill="'+blue+'" font-size="12.5" font-weight="700">'+p.v.toFixed(2)+'%</text></g>'}).join('');\n    const bPts=days.map(function(d,i){return {x:x(i),y:yBeh(d.behaviors),v:d.behaviors,date:d.date}}),bPath=bPts.length>1?'<polyline points="'+bPts.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="'+yellow+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':'',bDots=bPts.map(function(p){return '<g><circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="'+yellow+'"><title>'+esc(fmt(p.date)+' Behavior Rate '+p.v)+'</title></circle><text x="'+p.x+'" y="'+(p.y+26)+'" text-anchor="middle" fill="'+yellow+'" font-size="12.5" font-weight="700">'+p.v+'</text></g>'}).join('');\n    const goalY=yPct(target),goalLine='<line x1="'+x(0)+'" y1="'+goalY+'" x2="'+x(days.length-1)+'" y2="'+goalY+'" stroke="'+red+'" stroke-width="3"/>',dates=days.map(function(d,i){const xx=x(i);return '<text x="'+xx+'" y="'+(plotBottom+30)+'" text-anchor="end" fill="'+ink+'" font-size="12.5" transform="rotate(-45 '+xx+' '+(plotBottom+30)+')">'+esc(fmt(d.date))+'</text>'}).join('');\n    const legend='<div style="display:flex;justify-content:center;gap:24px;align-items:center;flex-wrap:wrap;margin:-4px 0 8px;font-size:13px;color:'+ink+'"><span style="display:inline-flex;align-items:center;gap:7px"><i style="width:20px;height:4px;background:'+blue+'"></i>Achieved</span><span style="display:inline-flex;align-items:center;gap:7px"><i style="width:20px;height:4px;background:'+red+'"></i>Goal</span><span style="display:inline-flex;align-items:center;gap:7px"><i style="width:20px;height:4px;background:'+yellow+'"></i>Behavior Rate</span></div>';\n    const latest=days.slice().reverse().find(function(d){return d.achieved!=null});label.textContent=selected.programName+' · '+days.length+' session day'+(days.length===1?'':'s')+(latest?(' · Latest achieved '+latest.achieved.toFixed(1)+'%'):'')+' · Goal '+target.toFixed(0)+'%';\n    el.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><div style="font-size:13px;color:'+muted+'">Progress by session date</div>'+selector+'</div><div style="font-size:25px;font-weight:400;color:#757575;margin:10px 0 6px">Achieved and Goal</div>'+legend+'<div class="compass-chart-scroll"><svg viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'" role="img" aria-label="Program progress by date with achieved, goal and behavior rate">'+leftTicks+rightTicks+'<line x1="'+left+'" y1="'+plotBottom+'" x2="'+(width-right)+'" y2="'+plotBottom+'" stroke="#4b5563"/>'+goalLine+aPath+aDots+bPath+bDots+dates+'</svg></div><div class="compass-chart-note">Achieved = independent correct trials ÷ total trials. Goal = the program goal percentage. Behavior Rate = recorded behavior events for that program session date and uses the right-side axis.</div>';\n    const select=el.querySelector('#compassProgramProgressSelect');if(select)select.addEventListener('change',function(){el.dataset.programProgressId=this.value;compassRenderProgramChart(el,label,entries)});\n  }\n`;
    source=source.slice(0,programStart)+progressReplacement+source.slice(programEnd);
  }else console.warn('COMPASS Program Progress function target not found; keeping current graph.');

  document.open();document.write(source);document.close();
})().catch(err=>{console.error(err);const status=document.getElementById('status');if(status){status.className='status error';status.textContent=err&&err.message?err.message:'COMPASS could not be opened safely. Refresh and try again.';}});
</script>
</body>
</html>
