<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>COMPASS Student Support</title>
  <meta name="description" content="COMPASS Student Support brings student profiles, programs, behavior data, goals and service tracking into one connected workspace for multidisciplinary student support teams.">
  <meta name="theme-color" content="#10396c">
  <style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f7fb;color:#10396c;display:grid;place-items:center;min-height:100vh}.loading{font-weight:800}.error{max-width:620px;padding:28px}</style>
</head>
<body>
  <div class="loading">Opening COMPASS…</div>
  <script>
    (async()=>{
      const parts=['01','02','03','04','05','06'];
      let code='';
      for(const n of parts){
        const r=await fetch('./live/index-v20261009-3/part'+n+'.txt?v=20261009-3',{cache:'no-store'});
        if(!r.ok)throw new Error('Unable to load COMPASS launcher');
        code+=await r.text();
      }
      (0,eval)(code);
    })().catch(err=>{
      document.body.innerHTML='<div class="error"><h1>COMPASS could not open</h1><p>'+String(err.message||err)+'</p><button onclick="location.reload()">Retry</button></div>';
    });
  </script>
</body>
</html>
