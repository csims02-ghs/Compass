<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1727">
  <title>COMPASS</title>
  <style>html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#10243a}body{display:grid;place-items:center}.card{max-width:560px;margin:24px;padding:28px 30px;border:1px solid #dbe5ef;border-radius:18px;background:#fff;box-shadow:0 12px 38px rgba(13,34,56,.08);text-align:center}.brand{font-weight:800;letter-spacing:.05em;font-size:24px;margin-bottom:8px}.status{font-size:14px;color:#5f7388;line-height:1.5}.error{color:#9f1d20;font-weight:700}</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite"><div class="brand">COMPASS</div><div class="status" id="status">Opening COMPASS…</div></main>
<script>
(async()=>{
  const VERSION='v20261010-3';
  const BASE_EXPECTED='cf0bda37c623f1599ff73c1a751284946261fa3472b11abe7a4917afe9cd93b0';
  const FILES=["part01.txt","part02.txt","part03.txt","part04a.txt","part04b.txt","part04c.txt","part05.txt","part06.txt","part07.txt","part08a.txt","part08b.txt","part08c.txt","part09a.txt","part09b.txt","part09c.txt","part10a.txt","part10b.txt"];
  const PATCHES=[
    ["<nav class=\"nav\"><button data-page=\"calendar\">Calendar</button><button data-page=\"settings\">Settings</button></nav>","<nav class=\"nav\"><button data-page=\"settings\">Settings</button></nav>","sidebar Calendar"],
    ["<option value=\"data-collection\">Data Collection</option><option value=\"calendar\">Calendar</option>","<option value=\"data-collection\">Data Collection</option>","Browse Calendar"],
    ["                <button class=\"link-btn schedule-calendar-link\" type=\"button\" data-page=\"calendar\">View full calendar →</button>\n","","View full calendar"],
    ["<button id=\"homeCalendarAddEvent\" class=\"btn primary small\" type=\"button\">+ Add Event</button><button class=\"btn small\" type=\"button\" data-page=\"calendar\">Open Calendar</button>","<button id=\"homeCalendarAddEvent\" class=\"btn primary small\" type=\"button\">+ Add Event</button>","Open Calendar"],
    ["<section id=\"page-calendar\" class=\"page\"><div class=\"content calendar-content\"><div class=\"calendar-head\"><div class=\"calendar-controls\"><button id=\"calendarPrev\" class=\"btn primary\" type=\"button\">‹</button><button id=\"calendarNext\" class=\"btn primary\" type=\"button\">›</button><button id=\"calendarToday\" class=\"btn\" type=\"button\">Today</button></div><h1 id=\"calendarTitle\">Calendar</h1><button id=\"addEventBtn\" class=\"btn primary\" type=\"button\">+ Add Event</button></div><div id=\"calendarGrid\" class=\"calendar-grid\"></div></div></section>","","standalone Calendar page"],
    ["function renderCalendar(){renderCalendarInto('calendarTitle','calendarGrid');renderCalendarInto('homeCalendarTitle','homeCalendarGrid');showTodayInHomeCalendar()}","function renderCalendar(){renderCalendarInto('homeCalendarTitle','homeCalendarGrid');showTodayInHomeCalendar()}","calendar renderer"],
    ["function showPage(name,push=true){if(name==='student-search'||name==='student-directory')name='students';","function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';","Calendar route redirect"],
    ["$('calendarPrev').addEventListener('click',()=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()-1,1);renderCalendar()});$('calendarNext').addEventListener('click',()=>{state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+1,1);renderCalendar()});$('calendarToday').addEventListener('click',()=>{state.calendarDate=new Date();renderCalendar()});$('calendarGrid').addEventListener('dblclick',e=>{const d=e.target.closest('.cal-day');if(d&&!e.target.closest('[data-event-id]'))openEventModal(d.dataset.date)});\n  ","","standalone Calendar listeners"],
    ["$('addEventBtn').addEventListener('click',()=>openEventModal());","","standalone Add Event listener"],
    ["function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';qsa('.page').forEach(p=>p.classList.remove('active'));const p=$('page-'+name);if(!p)return;p.classList.add('active');qsa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(push)location.hash=name;$('sidebar').classList.remove('open');window.scrollTo({top:0});if(name==='students')renderDirectory();if(name==='data-collection')loadDataCollection();if(name==='offline-programs')renderOfflinePage();if(name==='home')showTodayInHomeCalendar()}","function showPage(name,push=true){if(name==='calendar')name='home';if(name==='student-search'||name==='student-directory')name='students';const p=$('page-'+name);if(!p)return;const siblings=p.parentElement?Array.from(p.parentElement.children).filter(el=>el.id&&el.id.startsWith('page-')):[];const candidates=new Set([...qsa('.page'),...siblings]);const home=$('page-home');if(home)candidates.add(home);candidates.forEach(page=>{const active=page===p;page.classList.toggle('active',active);page.hidden=!active;if(active){page.style.removeProperty('display')}else{page.style.setProperty('display','none','important')}});document.body.dataset.compassPage=name;document.body.classList.toggle('compass-home-active',name==='home');qsa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(push)location.hash=name;$('sidebar').classList.remove('open');window.scrollTo({top:0});if(name==='students')renderDirectory();if(name==='data-collection')loadDataCollection();if(name==='offline-programs')renderOfflinePage();if(name==='home')showTodayInHomeCalendar()}","isolated page controller"]
  ];
  const status=document.getElementById('status');
  let b64='';
  for(let i=0;i<FILES.length;i++){
    const name=FILES[i];
    status.textContent=`Loading COMPASS ${i+1}/${FILES.length}…`;
    const r=await fetch(`./release/${VERSION}/${name}?release=${VERSION}-program-hub-v1`,{cache:'no-store'});
    if(!r.ok)throw new Error(`Release file ${name} failed to load (${r.status})`);
    b64+=(await r.text()).trim();
  }
  const binary=atob(b64),zipped=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)zipped[i]=binary.charCodeAt(i);
  if(typeof DecompressionStream!=='function')throw new Error('This browser cannot open the verified COMPASS release. Please update the browser.');
  const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
  const hex=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',value)),b=>b.toString(16).padStart(2,'0')).join('');
  if(await hex(bytes)!==BASE_EXPECTED)throw new Error('COMPASS release integrity check failed. Refresh before continuing.');
  let html=new TextDecoder().decode(bytes);
  for(const [from,to,label] of PATCHES){
    const first=html.indexOf(from);
    if(first<0||html.indexOf(from,first+from.length)>=0)throw new Error(`COMPASS page-scope check failed: ${label}`);
    html=html.replace(from,to);
  }
  // COMPASS IEP goal persistence v1
  const profileLoadStart=html.indexOf('async function loadStudentProfile(){');
  const profileLoadEnd=html.indexOf('async function loadTeam()',profileLoadStart);
  if(profileLoadStart<0||profileLoadEnd<0)throw new Error('COMPASS IEP goal persistence check failed: profile loader not found');
  const profileLoadReplacement=`let studentProfileLoadSeq=0;
  async function loadStudentProfile(){
    const s=state.currentStudent;if(!s)return;
    const sid=s.id,seq=++studentProfileLoadSeq;
    const priorPrograms=(Array.isArray(state.studentPrograms)?state.studentPrograms:[]).filter(x=>x.student_id===sid);
    const priorGoals=(Array.isArray(state.goals)?state.goals:[]).filter(x=>x.student_id===sid);
    const priorNotes=(Array.isArray(state.notes)?state.notes:[]).filter(x=>x.student_id===sid);
    const priorDocs=(Array.isArray(state.documents)?state.documents:[]).filter(x=>x.student_id===sid);
    const priorAssessments=(Array.isArray(state.assessments)?state.assessments:[]).filter(x=>x.student_id===sid);
    const priorServices=(Array.isArray(state.services)?state.services:[]).filter(x=>x.student_id===sid);
    const priorLogs=(Array.isArray(state.serviceLogs)?state.serviceLogs:[]).filter(x=>x.student_id===sid);
    const grab=async fn=>{try{return await fn()}catch(error){return{data:null,error}}};
    const take=(r,prior,label)=>{if(r&&r.error){console.warn('COMPASS profile reload failed: '+label,r.error);return prior}return Array.isArray(r?.data)?r.data:prior};
    const [programRes,goalRes,noteRes,docRes,assessmentRes,serviceRes,logRes]=await Promise.all([
      grab(()=>sb.from('student_compass_programs').select('*').eq('student_id',sid).order('display_order')),
      grab(()=>sb.from('student_iep_goals').select('*').eq('student_id',sid).order('created_at',{ascending:false})),
      grab(()=>sb.from('student_notes').select('*').eq('student_id',sid).order('note_date',{ascending:false}).order('created_at',{ascending:false})),
      grab(()=>sb.from('student_documents').select('*').eq('student_id',sid).order('created_at',{ascending:false})),
      grab(()=>sb.from('student_assessments').select('*').eq('student_id',sid).order('updated_at',{ascending:false})),
      grab(()=>sb.from('student_service_requirements').select('*').eq('student_id',sid).eq('active',true).order('service_name')),
      grab(()=>sb.from('service_delivery_logs').select('*').eq('student_id',sid).order('service_date',{ascending:false}).limit(100))
    ]);
    if(seq!==studentProfileLoadSeq||state.currentStudent?.id!==sid)return;
    const programs=take(programRes,priorPrograms,'programs'),goals=take(goalRes,priorGoals,'IEP goals'),notes=take(noteRes,priorNotes,'notes'),docs=take(docRes,priorDocs,'documents'),assessments=take(assessmentRes,priorAssessments,'assessments'),services=take(serviceRes,priorServices,'services'),logs=take(logRes,priorLogs,'service logs');
    Object.assign(state,{studentPrograms:programs,goals,notes,documents:docs,assessments,services,serviceLogs:logs});
    const ids=programs.map(x=>x.id),programIdSet=new Set(ids),priorSessions=(Array.isArray(state.sessions)?state.sessions:[]).filter(x=>programIdSet.has(x.student_compass_program_id));
    const sessionRes=ids.length?await grab(()=>sb.from('compass_program_sessions').select('*').in('student_compass_program_id',ids).order('session_date').order('created_at')):{data:[],error:null};
    if(seq!==studentProfileLoadSeq||state.currentStudent?.id!==sid)return;
    state.sessions=take(sessionRes,priorSessions,'sessions');
    const gids=goals.map(x=>x.id),goalIdSet=new Set(gids),priorLinks=(Array.isArray(state.goalLinks)?state.goalLinks:[]).filter(x=>goalIdSet.has(x.goal_id));
    const linkRes=gids.length?await grab(()=>sb.from('student_iep_goal_compass_programs').select('*').in('goal_id',gids)):{data:[],error:null};
    if(seq!==studentProfileLoadSeq||state.currentStudent?.id!==sid)return;
    state.goalLinks=take(linkRes,priorLinks,'IEP goal links');
    await loadTeam();
    if(seq!==studentProfileLoadSeq||state.currentStudent?.id!==sid)return;
    renderStudentProfile();
    await loadProgramLists();
  }
  `;
  html=html.slice(0,profileLoadStart)+profileLoadReplacement+html.slice(profileLoadEnd);

  const oldGoalSave=`let id=goal?.id;if(id){const {error}=await sb.from('student_iep_goals').update(payload).eq('id',id);if(error){toast(error.message,'error');return}const {error:de}=await sb.from('student_iep_goal_compass_programs').delete().eq('goal_id',id);if(de){toast(de.message,'error');return}}else{const {data,error}=await sb.from('student_iep_goals').insert(payload).select('id').single();if(error){toast(error.message,'error');return}id=data.id}const sel=qsa('input[name="goalProgram"]:checked',$('goalForm')).map(x=>x.value);if(sel.length){const {error}=await sb.from('student_iep_goal_compass_programs').insert(sel.map(sp=>({goal_id:id,student_compass_program_id:sp})));if(error){toast(error.message,'error');return}}closeModal();toast('IEP goal saved.');await loadStudentProfile();await loadGlobalData()`;
  const newGoalSave=`let id=goal?.id,savedGoal=null;if(id){const {data,error}=await sb.from('student_iep_goals').update(payload).eq('id',id).select('*').single();if(error){toast(error.message,'error');return}savedGoal=data;const {error:de}=await sb.from('student_iep_goal_compass_programs').delete().eq('goal_id',id);if(de){toast(de.message,'error');return}}else{const {data,error}=await sb.from('student_iep_goals').insert(payload).select('*').single();if(error){toast(error.message,'error');return}savedGoal=data;id=data.id}const sel=qsa('input[name="goalProgram"]:checked',$('goalForm')).map(x=>x.value),linkRows=sel.map(sp=>({goal_id:id,student_compass_program_id:sp}));if(linkRows.length){const {error}=await sb.from('student_iep_goal_compass_programs').insert(linkRows);if(error){toast(error.message,'error');return}}closeModal();if(savedGoal&&state.currentStudent?.id===payload.student_id){state.goals=[savedGoal,...(Array.isArray(state.goals)?state.goals:[]).filter(g=>g.id!==id&&g.student_id===payload.student_id)].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));state.goalLinks=[...(Array.isArray(state.goalLinks)?state.goalLinks:[]).filter(l=>l.goal_id!==id),...linkRows];renderStudentProfile()}toast('IEP goal saved.');await loadStudentProfile();if(savedGoal&&state.currentStudent?.id===payload.student_id&&!state.goals.some(g=>g.id===id)){state.goals=[savedGoal,...state.goals.filter(g=>g.id!==id)];state.goalLinks=[...state.goalLinks.filter(l=>l.goal_id!==id),...linkRows];renderStudentProfile()}await loadGlobalData()`;
  if(html.split(oldGoalSave).length!==2)throw new Error('COMPASS IEP goal persistence check failed: goal save handler not found exactly once');
  html=html.replace(oldGoalSave,newGoalSave);

  // COMPASS checkbox assign programs v1
  const assignProgramStart=html.indexOf("function openAssignProgram(pre=''){");
  const assignProgramEnd=html.indexOf('function activeStudentProgramsOrdered()',assignProgramStart);
  if(assignProgramStart<0||assignProgramEnd<0)throw new Error('COMPASS checkbox assignment check failed: handler not found');
  const assignProgramReplacement="function openAssignProgram(pre=''){\n  if(!state.currentStudent){toast('Open a student profile first.','error');return}\n  const assigned=new Set(state.studentPrograms.filter(sp=>['active','hold','mastered'].includes(sp.status)).map(sp=>sp.program_id));\n  const available=state.programCatalog.filter(p=>p.active!==false&&!assigned.has(p.id)).sort((a,b)=>String(a.program_name||'').localeCompare(String(b.program_name||'')));\n  const rows=available.map(p=>`<label class=\"assign-program-choice\" data-program-search=\"${esc(((p.program_name||'Program')+' '+programDomain(p)).toLowerCase())}\"><input type=\"checkbox\" name=\"assignProgramChoice\" value=\"${p.id}\"${p.id===pre?' checked':''}><span><strong>${esc(p.program_name||'Program')}</strong><small>${esc(programDomain(p))}</small></span></label>`).join('');\n  openModal('Assign COMPASS Programs',`<form id=\"assignProgramForm\" class=\"form-stack assign-program-form\"><div class=\"assign-program-picker-head\"><div><strong>Select Programs</strong><small>Check one or more programs to assign to this student.</small></div><strong id=\"assignProgramSelectedCount\" class=\"assign-program-selected-count\">0 selected</strong></div>${available.length?'<input id=\"assignProgramSearch\" type=\"search\" placeholder=\"Search available programs\u2026\"><div class=\"assign-program-picker-actions\"><button id=\"assignProgramCheckAll\" class=\"btn small\" type=\"button\">Check All</button><button id=\"assignProgramClear\" class=\"btn small\" type=\"button\">Clear</button></div>':''}<div id=\"assignProgramPicker\" class=\"assign-program-picker\">${rows||'<div class=\"empty-state compact\">All active COMPASS programs are already assigned to this student.</div>'}</div><div class=\"two-col\"><label>Goal %<input id=\"assignProgramGoal\" type=\"number\" min=\"0\" max=\"100\" value=\"80\"></label><label>Trials Per Session<input id=\"assignProgramTrials\" type=\"number\" min=\"1\" max=\"100\"></label></div><button class=\"btn primary assign-program-submit\" type=\"submit\"${available.length?'':' disabled'}>Assign Selected Programs</button></form>`,()=>{\n    document.querySelector('.modal')?.classList.add('assign-program-modal');\n    const checks=()=>qsa('#assignProgramPicker input[name=\"assignProgramChoice\"]');\n    const refreshCount=()=>{const n=checks().filter(c=>c.checked).length,el=$('assignProgramSelectedCount');if(el)el.textContent=n+' selected'};\n    $('assignProgramSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();qsa('#assignProgramPicker .assign-program-choice').forEach(row=>row.classList.toggle('assign-program-filtered',!!q&&!String(row.dataset.programSearch||'').includes(q)))});\n    $('assignProgramCheckAll')?.addEventListener('click',()=>{checks().filter(c=>!c.closest('.assign-program-filtered')).forEach(c=>c.checked=true);refreshCount()});\n    $('assignProgramClear')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=false);refreshCount()});\n    $('assignProgramPicker')?.addEventListener('change',refreshCount);\n    refreshCount();\n    $('assignProgramForm').addEventListener('submit',async e=>{\n      e.preventDefault();\n      const pids=checks().filter(c=>c.checked).map(c=>c.value);\n      if(!pids.length){toast('Select at least one COMPASS program.','error');return}\n      const visible=state.studentPrograms.filter(x=>x.status!=='archived');\n      const max=Math.max(0,...visible.map(x=>Number(x.display_order||0)));\n      const goal=Number($('assignProgramGoal').value||80),trials=$('assignProgramTrials').value?Number($('assignProgramTrials').value):null;\n      const insertRows=pids.map((pid,i)=>({student_id:state.currentStudent.id,program_id:pid,assigned_by:state.user.id,status:'active',goal_percentage:goal,display_order:max+i+1,trials_per_session:trials}));\n      const {error}=await sb.from('student_compass_programs').insert(insertRows);\n      if(error){toast(error.message,'error');return}\n      closeModal();toast(insertRows.length===1?'COMPASS program assigned.':insertRows.length+' COMPASS programs assigned.');await loadStudentProfile()\n    })\n  })\n}\n";
  html=html.slice(0,assignProgramStart)+assignProgramReplacement+html.slice(assignProgramEnd);
  const assignProgramCss="<style id=\"compass-assign-checkbox-css\">\n.assign-program-modal{width:min(760px,calc(100vw - 28px))!important}\n.assign-program-form{gap:12px!important}\n.assign-program-picker-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}\n.assign-program-picker-head small{display:block;color:var(--muted);font-weight:400;margin-top:3px}\n.assign-program-selected-count{white-space:nowrap;font-size:13px;color:var(--muted)}\n.assign-program-picker-actions{display:flex;gap:8px;align-items:center}\n.assign-program-picker{display:grid;gap:7px;max-height:min(48vh,430px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#f8fbff}\n.assign-program-choice{display:grid!important;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px!important;padding:9px 10px;border:1px solid #dbe5ef;border-radius:10px;background:#fff;cursor:pointer}\n.assign-program-choice:hover{border-color:#b9cbe0}\n.assign-program-choice input[type=checkbox]{width:18px!important;height:18px!important;min-width:18px!important;margin:0!important;padding:0!important}\n.assign-program-choice span{min-width:0}\n.assign-program-choice strong,.assign-program-choice small{display:block}\n.assign-program-choice strong{font-size:14px;overflow-wrap:anywhere}\n.assign-program-choice small{color:var(--muted);margin-top:2px}\n.assign-program-filtered{display:none!important}\n@media(max-width:600px){.assign-program-picker-head{align-items:flex-start;flex-direction:column}.assign-program-selected-count{align-self:flex-start}.assign-program-picker{max-height:46vh}.assign-program-modal{width:calc(100vw - 20px)!important}}\n</style>";
  if(!html.includes('id=\"compass-assign-checkbox-css\"')){const assignHeadClose=html.indexOf('</head>');if(assignHeadClose<0)throw new Error('COMPASS checkbox assignment check failed: head not found');html=html.slice(0,assignHeadClose)+assignProgramCss+html.slice(assignHeadClose)}

  const listFnStart=html.indexOf('function openCreateProgramList(list=null){');
  const listFnEnd=html.indexOf('async function archiveProgramList',listFnStart);
  if(listFnStart<0||listFnEnd<0)throw new Error('COMPASS program-list picker check failed: handler not found');
  const programListReplacement="function openCreateProgramList(list=null){\n    if(!state.currentStudent){toast('Open a student first.','error');return}\n    const active=[...state.studentPrograms].filter(sp=>sp.status==='active'&&sp.student_id===state.currentStudent.id).sort((a,b)=>(Number(a.display_order||0)-Number(b.display_order||0))||String(a.id).localeCompare(String(b.id)));\n    const existing=list?new Map(listItems(list.id).map(x=>[x.student_compass_program_id,x.display_order])):new Map();\n    const cards=active.map((sp,i)=>{\n      const p=programById(sp.program_id),checked=existing.has(sp.id),order=existing.get(sp.id)||i+1;\n      return `<label class=\"program-list-check program-library-check\" data-program-search=\"${esc(((p?.program_name||'Program')+' '+programDomain(p)).toLowerCase())}\"><input type=\"checkbox\" name=\"programListProgram\" value=\"${sp.id}\"${checked?' checked':''}><input type=\"number\" name=\"programListOrder-${sp.id}\" min=\"1\" value=\"${order}\" aria-label=\"Order for ${esc(p?.program_name||'Program')}\"><span><strong>${esc(p?.program_name||'Program')}</strong><small>${esc(programDomain(p))}</small></span></label>`;\n    }).join('');\n    openModal(list?'Edit Program List':'Create Program List',`<form id=\"programListForm\" class=\"form-stack program-list-library-form\"><label>List Name<input id=\"programListName\" value=\"${esc(list?.name||'Daily Programs')}\" required></label><div><div class=\"program-list-picker-head\"><div><strong>Select This Student's Programs and Order</strong><p class=\"muted\">Choose from ${esc(studentLabel(state.currentStudent))}'s active assigned programs. Use the order number to set the sequence.</p></div><strong id=\"programListSelectedCount\" class=\"program-list-selected-count\">0 selected</strong></div>${active.length?`<input id=\"programListSearch\" class=\"program-list-search\" type=\"search\" placeholder=\"Search this student's ${active.length} active program${active.length===1?'':'s'}…\"><div class=\"program-list-picker-actions\"><button id=\"programListCheckAll\" class=\"btn small\" type=\"button\">Check All</button><button id=\"programListClearChecks\" class=\"btn small\" type=\"button\">Clear Checks</button></div>`:''}<div id=\"programListPicker\" class=\"program-list-picker\">${cards||'<div class=\"muted\">This student has no active assigned programs. Use <strong>+ Assign Program</strong> first.</div>'}</div></div><button class=\"btn primary\" type=\"submit\"${active.length?'':' disabled'}>${list?'Save List':'Create Program List'}</button></form>`,()=>{\n      document.querySelector('.modal')?.classList.add('program-list-library-modal');\n      const checks=()=>qsa('#programListPicker input[name=\"programListProgram\"]');\n      const refreshCount=()=>{const el=$('programListSelectedCount');if(el)el.textContent=checks().filter(c=>c.checked).length+' selected'};\n      $('programListSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();qsa('#programListPicker .program-library-check').forEach(row=>row.classList.toggle('program-list-filtered',!!q&&!String(row.dataset.programSearch||'').includes(q)))});\n      $('programListCheckAll')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=true);refreshCount()});\n      $('programListClearChecks')?.addEventListener('click',()=>{checks().forEach(c=>c.checked=false);refreshCount()});\n      $('programListPicker')?.addEventListener('change',refreshCount);\n      refreshCount();\n      $('programListForm').addEventListener('submit',async e=>{\n        e.preventDefault();\n        const selected=checks().filter(c=>c.checked).map((c,index)=>({id:c.value,order:Number(document.querySelector(`[name=\"programListOrder-${c.value}\"]`)?.value||999),index})).sort((a,b)=>(a.order-b.order)||(a.index-b.index));\n        if(!selected.length){toast('Select at least one program.','error');return}\n        let listId=list?.id;\n        if(listId){\n          const {error}=await sb.from('student_program_lists').update({name:$('programListName').value.trim(),updated_at:new Date().toISOString()}).eq('id',listId).eq('student_id',state.currentStudent.id);\n          if(error){toast(error.message,'error');return}\n          const {error:de}=await sb.from('student_program_list_items').delete().eq('list_id',listId);\n          if(de){toast(de.message,'error');return}\n        }else{\n          const {data,error}=await sb.from('student_program_lists').insert({student_id:state.currentStudent.id,name:$('programListName').value.trim(),created_by:state.user.id,status:'active'}).select('*').single();\n          if(error){toast(error.message,'error');return}\n          listId=data.id\n        }\n        const rows=selected.map((x,i)=>({list_id:listId,student_compass_program_id:x.id,display_order:i+1}));\n        const {error:itemErr}=await sb.from('student_program_list_items').insert(rows);\n        if(itemErr){toast(itemErr.message,'error');return}\n        await idbDelete('lists',listId).catch(()=>{});\n        closeModal();toast(list?'Program List updated.':'Program List created.');\n        await loadProgramLists()\n      })\n    })\n  }\n  ";
  html=html.slice(0,listFnStart)+programListReplacement+html.slice(listFnEnd);

  const assignedHead='<div class="button-row program-admin-actions"><button class="btn small" data-action="edit-programs" type="button">Edit Programs</button><button class="btn primary small assign-program-compact" data-action="assign-program" type="button">+ Assign Program</button></div>';
  const assignedHeadReplacement='<div class="button-row program-admin-actions"><button id="runStudentProgramsBtn" class="btn primary small" type="button">Run Programs</button><button class="btn small" data-action="edit-programs" type="button">Edit Programs</button><button class="btn primary small assign-program-compact" data-action="assign-program" type="button">+ Assign Program</button></div>';
  if(!html.includes(assignedHead))throw new Error('COMPASS Program Hub check failed: Assigned Programs header not found');
  html=html.replace(assignedHead,assignedHeadReplacement);

  const runnerStart=html.indexOf('function openRunner(spid,token,name){');
  const runnerEnd=html.indexOf('function closeRunner()',runnerStart);
  if(runnerStart<0||runnerEnd<0)throw new Error('COMPASS runtime render check failed');
  const runtimeReplacement="async function loadRuntimeHtml(spid,token){const u=`${cfg.SUPABASE_URL}/functions/v1/compass-student-program-runtime?assignment_id=${encodeURIComponent(spid)}&token=${encodeURIComponent(token)}&staff_id=${encodeURIComponent(state.user?.id||'')}`;const r=await fetch(u,{cache:'no-store'}),t=await r.text();if(!r.ok)throw new Error('Program runtime failed ('+r.status+')');let h=t;try{const j=JSON.parse(t);h=typeof j==='string'?j:(j.html||j.runner_html||j.data?.html||j.body||t)}catch{}return h}function openStudentProgramHub(assignmentId=''){if(!state.currentStudent){toast('Open a student first.','error');return}const q=new URLSearchParams({student_id:state.currentStudent.id});if(assignmentId)q.set('assignment_id',assignmentId);const w=window.open('./program-hub.html?'+q.toString(),'_blank','noopener');if(!w)toast('Allow pop-ups for COMPASS to open the Program Hub.','error')}async function openRunner(spid,token,name){if(!token){toast('This assigned program does not have a runtime token.','error');return}$('runnerTitle').textContent=name||'Program Runner';$('runnerBackdrop').classList.remove('hidden');$('runnerFrame').removeAttribute('src');$('runnerFrame').srcdoc='<p style=\"font-family:Arial;padding:24px\">Loading program…</p>';try{$('runnerFrame').srcdoc=await loadRuntimeHtml(spid,token)}catch(e){console.error(e);toast(e.message||'Program could not open.','error')}}\n  ";
  html=html.slice(0,runnerStart)+runtimeReplacement+html.slice(runnerEnd);

  const singleRun="const run=e.target.closest('[data-run-program]');if(run){const sp=state.studentPrograms.find(x=>x.id===run.dataset.runProgram),p=programById(sp?.program_id);if(sp)openRunner(sp.id,sp.view_token,p?.program_name);return}";
  const singleRunReplacement="const run=e.target.closest('[data-run-program]');if(run){const sp=state.studentPrograms.find(x=>x.id===run.dataset.runProgram);if(sp)openStudentProgramHub(sp.id);return}";
  if(!html.includes(singleRun))throw new Error('COMPASS Program Hub check failed: assigned-program Run handler not found');
  html=html.replace(singleRun,singleRunReplacement);

  const editListener="$('editStudentBtn').addEventListener('click',openEditStudent);";
  if(!html.includes(editListener))throw new Error('COMPASS Program Hub check failed: student action listeners not found');
  html=html.replace(editListener,editListener+"$('runStudentProgramsBtn')?.addEventListener('click',()=>openStudentProgramHub());");

  const listRunStart=html.indexOf('async function runCurrentProgramListItem(){');
  const listRunEnd=html.indexOf('async function advanceProgramList(){',listRunStart);
  if(listRunStart>=0&&listRunEnd>listRunStart){
    let listRun=html.slice(listRunStart,listRunEnd);
    listRun=listRun.replace("$('runnerFrame').src=`${cfg.SUPABASE_URL}/functions/v1/compass-student-program-runtime?assignment_id=${encodeURIComponent(sp.id)}&token=${encodeURIComponent(sp.view_token)}&staff_id=${encodeURIComponent(state.user?.id||'')}`","await loadRuntimeHtml(sp.id,sp.view_token).then(h=>{$('runnerFrame').removeAttribute('src');$('runnerFrame').srcdoc=h})");
    html=html.slice(0,listRunStart)+listRun+html.slice(listRunEnd)
  }
  const nextBridgeNeedle="window.addEventListener('message',async e=>{";
  const nextBridgeAt=html.indexOf(nextBridgeNeedle);
  if(nextBridgeAt<0||html.indexOf(nextBridgeNeedle,nextBridgeAt+nextBridgeNeedle.length)>=0)throw new Error('COMPASS Next Program bridge check failed');
  html=html.replace(nextBridgeNeedle,"window.addEventListener('message',async e=>{if(e.source===$('runnerFrame')?.contentWindow&&e.data?.type==='compass-next-program'){if(state.activeProgramListRun){await advanceProgramList()}else{toast('Next Program is available when a Program List is running.','error')}return}");
  const scopeStyle='<style id="compass-page-isolation-scope">[id^="page-"][hidden]{display:none!important}body[data-compass-page]:not([data-compass-page="home"]) #page-home{display:none!important}#page-home:not(.active) .home-schedule-card,#page-home:not(.active) .home-calendar-card,body:not(.compass-home-active) .home-schedule-card,body:not(.compass-home-active) .home-calendar-card{display:none!important}</style>';
  const programListStyle="<style id=\"compass-program-list-library-picker\">\n.program-list-library-modal{width:min(940px,94vw)!important}\n.program-list-library-modal .modal-body{padding:18px 20px!important;overflow:hidden!important}\n.program-list-library-form{max-height:calc(90vh - 92px);min-height:0}\n.program-list-picker-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}\n.program-list-picker-head p{margin:4px 0 0}\n.program-list-selected-count{white-space:nowrap;color:var(--blue);font-size:13px}\n.program-list-search{width:100%;margin:10px 0 8px}\n.program-list-picker-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}\n.program-list-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:430px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:8px;border:1px solid var(--line);border-radius:12px;background:#f7faff}\n.program-list-picker .program-list-check{grid-template-columns:auto 54px minmax(0,1fr);background:#fff;min-width:0;margin:0}\n.program-list-picker .program-list-check input[type=checkbox]{width:18px;height:18px;margin:0}\n.program-list-picker .program-list-check input[type=number]{width:54px}\n.program-list-picker .program-list-check span{min-width:0}\n.program-list-picker .program-list-check strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.program-list-picker .program-list-check small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.program-list-filtered{display:none!important}\n@media(max-width:760px){.program-list-library-modal{width:min(680px,96vw)!important}.program-list-picker{grid-template-columns:1fr;max-height:55vh}.program-list-picker-head{flex-direction:column;gap:6px}}\n</style>";
  const headClose=html.indexOf('</head>');
  if(headClose<0)throw new Error('COMPASS page-scope check failed: document head');
  html=html.slice(0,headClose)+scopeStyle+programListStyle+html.slice(headClose);
  if(html.includes('id="page-calendar"'))throw new Error('COMPASS page-scope check failed: Calendar page still present');
  if(!html.includes("document.body.dataset.compassPage=name"))throw new Error('COMPASS page-scope check failed: route ownership');
  if(!html.includes("page.style.setProperty('display','none','important')"))throw new Error('COMPASS page-scope check failed: inactive page visibility');
  if(!html.includes('id="compass-page-isolation-scope"'))throw new Error('COMPASS page-scope check failed: isolation CSS');
  if(!html.includes('id="compass-program-list-library-picker"'))throw new Error('COMPASS program-list picker check failed: style missing');
  if(!html.includes('program-list-library-modal'))throw new Error('COMPASS program-list picker check failed: modal missing');
  if(!html.includes("sp.student_id===state.currentStudent.id"))throw new Error('COMPASS student-program scope check failed');
  if(!html.includes('loadRuntimeHtml'))throw new Error('COMPASS runtime render check failed');
  if(!html.includes('openStudentProgramHub'))throw new Error('COMPASS Program Hub check failed: launcher missing');
  if(!html.includes('id="runStudentProgramsBtn"'))throw new Error('COMPASS Program Hub check failed: Run Programs button missing');
  if(!html.includes("e.data?.type==='compass-next-program'"))throw new Error('COMPASS Next Program bridge check failed: listener missing');
  document.open();document.write(html);document.close();
})().catch(err=>{console.error(err);const status=document.getElementById('status');if(status){status.className='status error';status.textContent=err&&err.message?err.message:'COMPASS could not be opened safely. Refresh and try again.';}});
</script>
</body>
</html>
