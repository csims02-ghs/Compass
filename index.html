<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1727">
  <title>COMPASS</title>
  <style>html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#10243a}body{display:grid;place-items:center}.card{max-width:560px;margin:24px;padding:28px 30px;border:1px solid #dbe5ef;border-radius:18px;background:#fff;box-shadow:0 12px 38px rgba(13,34,56,.08);text-align:center}.brand{font-weight:800;letter-spacing:.05em;font-size:24px;margin-bottom:8px}.status{font-size:14px;color:#5f7388;line-height:1.5}.error{color:#9f1d20;font-weight:700}</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite"><div class="brand">COMPASS</div><div class="status" id="status">Opening COMPASS…</div></main>

<script type="text/plain" id="compassGoalChartPatch">
  // COMPASS IEP Goal Achievement combo chart v2 — bars + behavior-rate line.
  const goalChartStart=html.indexOf('function renderGoalAchievement(){');
  const goalChartEnd=html.indexOf('function renderChart(el,sessions){',goalChartStart);
  if(goalChartStart<0||goalChartEnd<0)throw new Error('COMPASS IEP goal chart style check failed');
  const goalChartReplacement=`async function renderGoalAchievement(){
    const el=$('overviewChart'),label=$('overviewProgressLabel');if(!el||!label)return;
    const sid=state.currentStudent&&state.currentStudent.id;if(!sid)return;
    const goals=(Array.isArray(state.goals)?state.goals:[]).filter(function(g){return !g.student_id||g.student_id===sid}).filter(function(g){return g.status!=='discontinued'});
    const goalIds=new Set(goals.map(function(g){return g.id}));
    const links=(Array.isArray(state.goalLinks)?state.goalLinks:[]).filter(function(l){return goalIds.has(l.goal_id)});
    const progs=Array.isArray(state.studentPrograms)?state.studentPrograms:[];
    const sessions=Array.isArray(state.sessions)?state.sessions:[];
    if(!goals.length){label.textContent='No IEP goals entered';el.innerHTML='<div class="chart-empty">No IEP goals have been added for this student yet.</div>';return}
    label.textContent='Loading IEP goal achievement…';
    let behavior=[];
    try{const r=await sb.from('student_behavior_data').select('data_date,count,behavior_name').eq('student_id',sid).order('data_date');if(!r.error&&Array.isArray(r.data))behavior=r.data}catch(error){console.warn('COMPASS behavior-rate chart data unavailable',error)}
    if(state.currentStudent?.id!==sid)return;
    const goalNo=function(g){const m=String(g.title||g.goal_area||'').match(/goal\s*(\d+)/i);return m?Number(m[1]):999};
    const ordered=[...goals].sort(function(a,b){return goalNo(a)-goalNo(b)||String(a.title||'').localeCompare(String(b.title||''))});
    const entries=ordered.map(function(g){
      const linkedIds=links.filter(function(l){return l.goal_id===g.id}).map(function(l){return l.student_compass_program_id});
      const linkedPrograms=linkedIds.map(function(id){return progs.find(function(p){return p.id===id})}).filter(Boolean);
      const programNames=linkedPrograms.map(function(sp){const p=programById(sp.program_id);return p&&p.program_name?p.program_name:'Program'});
      const gs=sessions.filter(function(s){return linkedIds.includes(s.student_compass_program_id)});
      const vals=gs.map(function(s){return accuracy(s)}).filter(function(v){return v!=null&&Number.isFinite(Number(v))}).map(Number);
      let achieved=vals.length?Math.round((vals.reduce(function(t,v){return t+v},0)/vals.length)*10)/10:null;
      if(achieved==null&&g.current_percent!=null&&Number.isFinite(Number(g.current_percent)))achieved=Math.round(Number(g.current_percent)*10)/10;
      const target=Number.isFinite(Number(g.target_percent))?Math.max(0,Math.min(100,Number(g.target_percent))):80;
      const dates=[...new Set(gs.map(function(s){return String(s.session_date||s.ended_at||s.created_at||'').slice(0,10)}).filter(Boolean))];
      const dayTotals=[];
      dates.forEach(function(d){const rows=behavior.filter(function(b){return String(b.data_date||'').slice(0,10)===d});if(rows.length)dayTotals.push(rows.reduce(function(t,b){return t+Number(b.count||0)},0))});
      const behaviorRate=dayTotals.length?Math.round((dayTotals.reduce(function(t,v){return t+v},0)/dayTotals.length)*100)/100:null;
      return {goal:g,target:target,achieved:achieved,behaviorRate:behaviorRate,programNames:programNames,sessionCount:gs.length};
    });
    const achievedVals=entries.map(function(e){return e.achieved}).filter(function(v){return v!=null&&Number.isFinite(v)});
    const avgAchieved=achievedVals.length?Math.round((achievedVals.reduce(function(t,v){return t+v},0)/achievedVals.length)*10)/10:null;
    const withProgramData=entries.filter(function(e){return e.sessionCount>0}).length;
    label.textContent=avgAchieved==null?'No program-session achievement data yet':('Average achieved '+avgAchieved+'% · '+withProgramData+' of '+entries.length+' goals with program data');
    const blue='#4285F4',red='#EA4335',yellow='#F9AB00',grid='#dbe5ef',ink='#16324f',muted='#637b98';
    const behaviorVals=entries.map(function(e){return e.behaviorRate}).filter(function(v){return v!=null&&Number.isFinite(v)});
    const rightMax=Math.max(5,behaviorVals.length?Math.ceil(Math.max.apply(null,behaviorVals)*1.25):5);
    const groupW=145,left=62,right=62,top=56,plotBottom=295,plotH=215,bottomLabel=108;
    const w=Math.max(920,left+right+entries.length*groupW),h=top+plotH+bottomLabel;
    const plotW=w-left-right;
    const yPct=function(v){return plotBottom-(plotH*(Math.max(0,Math.min(100,Number(v)||0))/100))};
    const yBeh=function(v){return plotBottom-(plotH*(Math.max(0,Math.min(rightMax,Number(v)||0))/rightMax))};
    const cx=function(i){return left+(i+0.5)*(plotW/entries.length)};
    const pctTicks=[0,25,50,75,100];
    const gridLines=pctTicks.map(function(v){const y=yPct(v);return '<line x1="'+left+'" y1="'+y+'" x2="'+(w-right)+'" y2="'+y+'" stroke="'+grid+'"/><text x="'+(left-10)+'" y="'+(y+4)+'" text-anchor="end" fill="'+muted+'" font-size="12">'+v.toFixed(0)+'.00%</text>'}).join('');
    const rightTicks=[0,1,2,3,4].map(function(i){const v=rightMax*i/4,y=yBeh(v);const text=Math.abs(v-Math.round(v))<0.001?String(Math.round(v)):v.toFixed(1);return '<text x="'+(w-right+12)+'" y="'+(y+4)+'" text-anchor="start" fill="'+muted+'" font-size="12">'+text+'</text>'}).join('');
    function wrapWords(text,max){const words=String(text||'').replace(/\s+/g,' ').trim().split(' '),lines=[];let line='';words.forEach(function(word){const next=line?line+' '+word:word;if(next.length>max&&line){lines.push(line);line=word}else line=next});if(line)lines.push(line);return lines.slice(0,4)}
    const bars=entries.map(function(e,i){
      const center=cx(i),barW=30,gap=4,targetY=yPct(e.target),targetH=plotBottom-targetY;
      const achieved=e.achieved==null?null:Math.max(0,Math.min(100,e.achieved)),achY=achieved==null?plotBottom:yPct(achieved),achH=achieved==null?0:plotBottom-achY;
      const title=esc((e.goal.title||e.goal.goal_area||'IEP Goal')+' | Programs: '+(e.programNames.length?e.programNames.join(', '):'No linked program')+' | Goal: '+e.target+'% | Achieved: '+(achieved==null?'No data':achieved+'%')+' | Behavior rate: '+(e.behaviorRate==null?'No data':e.behaviorRate));
      const blueX=center-barW-gap/2,redX=center+gap/2;
      const blueLabel='<text x="'+(blueX+barW/2)+'" y="'+(plotBottom-6)+'" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">'+e.target.toFixed(2)+'%</text>';
      const redLabel=achieved==null?'':'<text x="'+(redX+barW/2)+'" y="'+Math.min(plotBottom-6,achY+14)+'" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">'+achieved.toFixed(2)+'%</text>';
      const lines=wrapWords(e.goal.title||e.goal.goal_area||'IEP Goal',22),labelSvg=lines.map(function(line,j){return '<tspan x="'+center+'" dy="'+(j===0?0:13)+'">'+esc(line)+'</tspan>'}).join('');
      const programLine=e.programNames.length?('<tspan x="'+center+'" dy="14" fill="#7a8ea6" font-size="10">'+esc(e.programNames.length===1?e.programNames[0]:(e.programNames.length+' linked programs'))+'</tspan>'):'<tspan x="'+center+'" dy="14" fill="#9b6a00" font-size="10">No linked program</tspan>';
      return '<g><title>'+title+'</title><rect x="'+blueX+'" y="'+targetY+'" width="'+barW+'" height="'+targetH+'" rx="1" fill="'+blue+'"/>'+(achieved==null?'':'<rect x="'+redX+'" y="'+achY+'" width="'+barW+'" height="'+achH+'" rx="1" fill="'+red+'"/>')+blueLabel+redLabel+'<text x="'+center+'" y="'+(plotBottom+20)+'" text-anchor="middle" fill="'+ink+'" font-size="11">'+labelSvg+programLine+'</text></g>';
    }).join('');
    const behaviorPoints=entries.map(function(e,i){return e.behaviorRate==null?null:{x:cx(i),y:yBeh(e.behaviorRate),v:e.behaviorRate}}).filter(Boolean);
    const behaviorPath=behaviorPoints.length>1?'<polyline points="'+behaviorPoints.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="'+yellow+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>':'';
    const behaviorDots=behaviorPoints.map(function(p){return '<g><circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="'+yellow+'"/><text x="'+p.x+'" y="'+(p.y-9)+'" text-anchor="middle" fill="'+ink+'" font-size="11" font-weight="700" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round">'+p.v.toFixed(2)+'</text></g>'}).join('');
    const legend='<div style="display:flex;justify-content:center;gap:18px;flex-wrap:wrap;align-items:center;margin:2px 0 10px;font-size:13px;color:'+ink+'"><span style="display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:11px;height:11px;background:'+blue+';border-radius:1px"></i>Goal Rate</span><span style="display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:11px;height:11px;background:'+red+';border-radius:1px"></i>Achieved Rate</span><span style="display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:18px;height:4px;background:'+yellow+';border-radius:2px"></i>Behavior Rate</span></div>';
    const noBehavior=behaviorPoints.length?'':'<div style="text-align:center;color:#7a8ea6;font-size:12px;margin-top:4px">Behavior Rate appears when behavior data exists on dates the linked programs were run.</div>';
    el.innerHTML='<div style="width:100%"><div style="text-align:center;font-weight:700;font-size:16px;color:'+ink+';margin-bottom:7px">IEP Goal Achievement by Student Program</div>'+legend+'<div style="width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:4px"><svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="IEP Goal Achievement by Student Program">'+gridLines+rightTicks+'<line x1="'+left+'" y1="'+plotBottom+'" x2="'+(w-right)+'" y2="'+plotBottom+'" stroke="#7a8ea6"/><text x="18" y="'+(top+plotH/2)+'" text-anchor="middle" fill="'+ink+'" font-size="12" transform="rotate(-90 18 '+(top+plotH/2)+')">Goal Rate</text><text x="'+(w-15)+'" y="'+(top+plotH/2)+'" text-anchor="middle" fill="'+ink+'" font-size="12" transform="rotate(-90 '+(w-15)+' '+(top+plotH/2)+')">Behavior Rate / Trials</text>'+bars+behaviorPath+behaviorDots+'<text x="'+(w/2)+'" y="'+(h-8)+'" text-anchor="middle" fill="'+ink+'" font-size="12">IEP Goals</text></svg></div>'+noBehavior+'</div>';
  }
  `;
  html=html.slice(0,goalChartStart)+goalChartReplacement+html.slice(goalChartEnd);
</script>

<script>
(async()=>{
  const status=document.getElementById('status');
  const patch=document.getElementById('compassGoalChartPatch').textContent;
  const response=await fetch('./index-base-20261016.html?chart=v2',{cache:'no-store'});
  if(!response.ok)throw new Error('COMPASS base loader could not be opened ('+response.status+').');
  let source=await response.text();
  const marker='  document.open();document.write(html);document.close();';
  if(!source.includes(marker))throw new Error('COMPASS chart patch could not find the loader handoff.');
  source=source.replace(marker,patch+'\n'+marker);
  document.open();document.write(source);document.close();
})().catch(err=>{console.error(err);const status=document.getElementById('status');if(status){status.className='status error';status.textContent=err&&err.message?err.message:'COMPASS could not be opened safely. Refresh and try again.';}});
</script>
</body>
</html>
